<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="theme.css">
<title>レース — ハルカのセッティングノート</title>
<style>
/* ===========================================================================
   レース画面（docs/設計/画面設計.md、docs/設計/レース方式.md、docs/設計/無線.md）
   ベースは「画面の層」＝チームのPC。黒地・等幅・緑／白／琥珀。
   紙はハルカと主人公の無線だけ。実況と解説はモニターの文字。
   380px 幅を基準に、上から ログ → 車両情報 → コース図 → タイミングモニター → 操作。
   800px 以上では左右2カラム。**色は theme.css の変数でしか書かない。**
   =========================================================================== */

/* 地が画面の層なので、点の色は紙の赤／青ではなく発光風のほうを指す。
   JS からも参照する（makeCar / makeRival の color、凡例） */
:root { --car: var(--mon-car); --ai: var(--mon-ai); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--mon-bg); color: var(--mon-text);
  font-family: var(--mon-font); font-size: var(--fs-body); line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%; padding: 6px;
}
.jp { font-family: var(--jp-font); }
.sheet { max-width: 400px; margin: 0 auto; border: 1px solid var(--mon-line); padding: 3px; }
/* グリッドではなくブロックで積む。グリッドだと操作列の sticky が
   自分の行の高さぶんしか動けず、画面下に留まれない */
.sheet-inner { border: 1px solid var(--mon-line); padding: 8px; }
.sheet-inner > * + * { margin-top: 8px; }
.cols > * + *, .col > * + * { margin-top: 8px; }

h3.cap {
  margin: 0; font-size: var(--fs-label); letter-spacing: var(--ls-label); color: var(--mon-dim); font-weight: 400;
  padding: 4px 7px; border-bottom: 1px solid var(--mon-line); background: var(--mon-bg-2);
}

.titleblock {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  border-bottom: 1px solid var(--mon-line); padding-bottom: 6px;
}
.titleblock .k { font-size: var(--fs-label); letter-spacing: var(--ls-label); color: var(--mon-green); }
.titleblock .course { font-family: var(--jp-font); font-size: var(--fs-title); font-weight: 700; line-height: 1.3; }
.titleblock .prof { font-family: var(--jp-font); font-size: var(--fs-sub); color: var(--mon-dim); }
.lapcount { text-align: right; border: 1px solid var(--mon-line); padding: 2px 8px; line-height: 1.3; white-space: nowrap; }
.lapcount b { display: block; font-size: var(--fs-title); }
.lapcount span { font-size: var(--fs-label); letter-spacing: var(--ls-label); color: var(--mon-dim); }

/* --- 実況・無線ログ（画面の主役） -----------------------------------------
   実況と解説はモニターの文字。ハルカと主人公（ピット）だけ紙の吹き出しにする。 */
.logbox { border: 1px solid var(--mon-line); }
.log { height: 46vh; min-height: 250px; overflow-y: auto; padding: 6px 7px; scroll-behavior: smooth; }
.msg { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 3px 2px; font-size: var(--fs-body); line-height: 1.5; transition: opacity .3s; }
.msg .who { font-size: var(--fs-sub); letter-spacing: .06em; color: var(--mon-dim); padding-top: 4px; white-space: nowrap; }
.msg .txt { font-family: var(--jp-font); color: var(--mon-dim); }
.msg[data-speaker="announcer"] .txt { color: var(--mon-text); }
/* 紙の吹き出し。黒い画面の中で、人の言葉だけが紙になる */
.msg[data-speaker="haruka"] .txt,
.msg[data-speaker="player"] .txt {
  background: var(--paper); color: var(--ink); padding: 3px 8px;
  border-left: 2px solid var(--ink-2); font-size: var(--fs-body);
}
.msg[data-speaker="haruka"] .txt { border-left-color: var(--mon-car); }
.msg[data-speaker="haruka"] .who { color: var(--mon-car); }
.msg[data-speaker="player"] .who { color: var(--mon-text); }
.msg.info .txt { border-left-width: 3px; box-shadow: 0 0 0 1px var(--mon-car); }
.msg.info .mood { font-family: var(--mon-font); font-size: var(--fs-label); color: var(--ink-2); letter-spacing: var(--ls-label); margin-left: 6px; }
/* 古い行は薄く。ただし紙の吹き出しだけは opacity を掛けず、地と文字を落として退かせる
   （黒地の上で紙を半透明にすると、ただの灰色の箱になって読めなくなる） */
.msg.old { opacity: .45; }
.msg.old[data-speaker="haruka"], .msg.old[data-speaker="player"] { opacity: 1; }
.msg.old[data-speaker="haruka"] .who, .msg.old[data-speaker="player"] .who { opacity: .45; }
.msg.old[data-speaker="haruka"] .txt, .msg.old[data-speaker="player"] .txt {
  background: var(--paper-dim); color: var(--ink-2); border-left-color: var(--ink-2);
}
.msg.old.info .txt { box-shadow: 0 0 0 1px var(--ink-2); }
.msg .replies { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.msg .replies button {
  font: inherit; font-family: var(--jp-font); font-size: var(--fs-small); padding: 4px 8px; cursor: pointer;
  background: none; color: var(--ink); border: 1px solid var(--ink-2);
}
.msg .answer { font-size: var(--fs-small); color: var(--ink); margin-top: 4px; border-top: 1px dashed var(--ink-2); padding-top: 3px; }
.msg .answer .k { font-family: var(--mon-font); font-size: var(--fs-label); color: var(--ink-2); letter-spacing: var(--ls-label); }
.msg .note { font-size: var(--fs-sub); color: var(--ink-2); }

/* --- 車両情報パネル（テレメトリ） ------------------------------------------ */
.panel { border: 1px solid var(--mon-line); }
.panel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--mon-line); }
.panel .cell { background: var(--mon-bg); padding: 6px 8px; min-height: 54px; }
.panel .cell.wide { grid-column: 1 / -1; }
.panel .k { font-size: var(--fs-label); letter-spacing: var(--ls-label); color: var(--mon-dim); display: flex; justify-content: space-between; gap: 4px; }
.panel .k span { letter-spacing: 0; color: var(--mon-text); }
.panel .k span.warn { color: var(--mon-amber); }
.panel .k span.alarm { color: var(--mon-red); }
.panel .v { font-size: var(--fs-num); font-weight: 700; line-height: 1.3; }
.panel .v.big { font-size: var(--fs-num-lg); }   /* ラップタイムの大表示 */
.panel .v small { font-size: var(--fs-sub); font-weight: 400; color: var(--mon-dim); }
.panel .sub { font-size: var(--fs-sub); color: var(--mon-dim); }
.panel .sub.jp { font-family: var(--jp-font); }
.panel .sub b { font-weight: 400; color: var(--mon-text); }
.panel .sub.up b { color: var(--mon-green); }
.panel .sub.down b { color: var(--mon-amber); }

/* ゲージ：横棒に細い目盛。閾値の位置に縦線。
   9割で琥珀（点灯）、超えたら赤の点滅（docs/設計/画面設計.md） */
.gauge {
  position: relative; height: 9px; margin-top: 4px;
  border: 1px solid var(--mon-line); background-color: var(--mon-bg);
  background-image: repeating-linear-gradient(to right, var(--mon-line) 0 1px, transparent 1px 20%);
}
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mon-dim); }
.gauge i.ok { background: var(--mon-green); }
.gauge i.warn { background: var(--mon-amber); }
.gauge i.alarm { background: var(--mon-red); animation: blink .9s infinite; }
.gauge b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--mon-red); }
.gauge.thin { height: 7px; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .3; } }
.tiregauges { display: grid; grid-template-columns: 12px 1fr; gap: 2px 6px; align-items: center; margin-top: 2px; font-size: var(--fs-label); color: var(--mon-dim); }
.tiregauges .gauge { margin-top: 0; }
.sector-type { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }

/* --- コース図（黒地に細い線、点は発光風） ---------------------------------- */
.track { border: 1px solid var(--mon-line); }
.track svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 10px; font-family: var(--jp-font); font-size: var(--fs-label); color: var(--mon-dim); padding: 3px 7px; border-top: 1px solid var(--mon-line); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 3px; }
.legend b.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }

/* --- タイミングモニター ---------------------------------------------------- */
.standings { border: 1px solid var(--mon-line); }
.standings h3 button {
  float: right; font: inherit; font-size: var(--fs-label); letter-spacing: var(--ls-label); padding: 0 6px; cursor: pointer;
  background: none; color: var(--mon-text); border: 1px solid var(--mon-line);
}
.standings h3 button.on { color: var(--mon-green); border-color: var(--mon-green); }
.standings .full { max-height: 150px; overflow-y: auto; border-top: 1px solid var(--mon-line); }
.row {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) repeat(3, 42px) 102px 54px;
  gap: 0 5px; align-items: baseline;
  padding: 3px 6px; border-bottom: 1px solid var(--mon-line); font-size: var(--fs-sub); line-height: 1.6;
}
.row:last-child { border-bottom: 0; }
.row.head { color: var(--mon-dim); font-size: var(--fs-label); letter-spacing: var(--ls-label); background: var(--mon-bg-2); }
.row.me { background: var(--mon-bg-2); }
.row.out { color: var(--mon-dim); opacity: .6; }
.row.gapline { display: block; text-align: center; color: var(--mon-dim); font-size: var(--fs-label); padding: 0; line-height: 1.5; }
.row .pos { text-align: right; color: var(--mon-dim); }
.row.me .pos { color: var(--mon-text); }
.row .nm { display: flex; align-items: center; gap: 4px; min-width: 0; font-family: var(--jp-font); font-size: var(--fs-sub); }
.row .nm b { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm .short { display: none; }
.row .s, .row .last, .row .gap { text-align: right; }
/* 狭い画面で消す桁。<i> の既定の斜体を打ち消す（数字が傾くと桁が読みにくい） */
.row .opt { font-style: normal; }
.row .s { color: var(--mon-dim); }
.row .s.green  { color: var(--mon-green); }
.row .s.yellow { color: var(--mon-amber); }
.row .s.purple { color: var(--mon-purple); }
.row .last { color: var(--mon-text); font-size: var(--fs-last); }
.row .gap { color: var(--mon-dim); }
.row.me .gap, .row.me .last { color: var(--mon-text); }
/* チェッカー：自車の行が光る。勝てば3回、負けても1回 */
.row.fin { animation: winflash .9s ease-out 1; }
.row.win { animation: winflash .9s ease-out 3; }
@keyframes winflash {
  from { background: var(--mon-green); color: var(--mon-bg); }
  to   { background: var(--mon-bg-2); }
}

/* --- 操作（画面の下に貼り付く） -------------------------------------------
   倍速の切り替えはいつでも押せる必要がある。下まで読み終えると流れの中に収まる。
   左右の負マージンは、枠の内側いっぱいに地を敷いて後ろの行を透かさないため。 */
.controls {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  margin-left: -8px; margin-right: -8px; padding: 7px 8px;
  background: var(--mon-bg); border-top: 1px solid var(--mon-line);
}
.controls button {
  font: inherit; font-family: var(--jp-font); font-size: var(--fs-body); padding: 7px 12px; cursor: pointer; letter-spacing: .06em;
  background: none; color: var(--mon-text); border: 1px solid var(--mon-line);
}
.controls button:hover { border-color: var(--mon-text); }
.controls button.on { color: var(--mon-green); border-color: var(--mon-green); }
.controls .spacer { margin-left: auto; }
.controls a { font-family: var(--jp-font); font-size: var(--fs-small); color: var(--mon-dim); text-decoration: none; border-bottom: 1px solid var(--mon-line); }
.controls a.btn { font-size: var(--fs-body); padding: 7px 12px; border: 1px solid var(--mon-line); color: var(--mon-text); letter-spacing: .06em; }
.controls a.btn.primary { color: var(--mon-green); border-color: var(--mon-green); font-weight: 700; }

/* --- 結果 ----------------------------------------------------------------- */
.result { border: 1px solid var(--mon-line); }
.balance { padding: 4px 8px; }
.brow { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--mon-line); }
.brow:last-child { border-bottom: 0; }
.brow .k { font-family: var(--jp-font); font-size: var(--fs-small); color: var(--mon-dim); }
.brow .v { font-size: var(--fs-num); }
.brow.up .v { color: var(--mon-green); }
.brow.down .v { color: var(--mon-amber); }
.brow.total .v { font-size: var(--fs-num-lg); font-weight: 700; }
.brow.wear .v { font-family: var(--jp-font); font-size: var(--fs-small); text-align: right; color: var(--mon-dim); }
.brow.wear .wear.broken { color: var(--mon-red); }
.brow .v small { font-family: var(--jp-font); font-size: var(--fs-sub); color: var(--mon-dim); }
.rrow {
  display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: baseline;
  padding: 5px 8px; border-bottom: 1px solid var(--mon-line); font-family: var(--jp-font); font-size: var(--fs-body);
}
.rrow:last-child { border-bottom: 0; }
.rrow.me { background: var(--mon-bg-2); }
.rrow .pos { font-family: var(--mon-font); font-weight: 700; text-align: right; }
.rrow .sub { font-size: var(--fs-sub); color: var(--mon-dim); }
.rrow .t { text-align: right; font-family: var(--mon-font); }
.err { border: 1px solid var(--mon-red); color: var(--mon-red); padding: 10px; font-family: var(--jp-font); font-size: var(--fs-body); margin-bottom: 8px; }

/* 幅が足りないときは、まず数字の末尾を削る。
   LAST（直近のラップタイム）はこの画面の主役なので最後まで大きさを保つ。
   .opt が付いているのは「無くても読める桁」＝セクターの 1/100 秒と、ギャップの単位。 */
@media (max-width: 420px) {
  .row { grid-template-columns: 18px minmax(0, 1fr) repeat(3, 31px) 100px 48px; gap: 0 3px; }
  /* 列幅は変えずに字だけ1段小さくする。右揃えなので、空いたぶんが数字の間の余白になる */
  .row .s { font-size: var(--fs-label); }
  /* 名前はゼッケンだけにする。本物のタイミング画面と同じで、まず番号で追う */
  .row .nm .full { display: none; }
  .row .nm .short { display: inline; }
  .row .opt { display: none; }
}
@media (max-width: 340px) {
  /* それでも入らなければセクターごと畳む。順位・タイム・ギャップは残す */
  .row { grid-template-columns: 18px minmax(0, 1fr) 100px 48px; }
  .row .s { display: none; }
}

/* --- 800px 以上：左＝無線ログと車両情報、右＝コース図とタイミングモニター。
       操作列は両カラムの下（sheet-inner の直下にあるので自然にそうなる）。 --- */
@media (min-width: 800px) {
  .sheet { max-width: 880px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; align-items: start; }
  .cols > * + * { margin-top: 0; }
  .log { height: 52vh; }
  /* 縦に余裕があるので、「全車」を開いたときは中でスクロールさせない */
  .standings .full { max-height: none; }
}
</style>
</head>
<body>

<div class="sheet"><div class="sheet-inner">

  <div class="titleblock">
    <div>
      <div class="k">COURSE</div>
      <div class="course" id="courseName">—</div>
      <div class="prof" id="courseProf">—</div>
    </div>
    <div class="lapcount"><span>LAP</span><b id="lapNow">—</b></div>
  </div>

  <!-- 狭い画面では上から順に積む。800px 以上で左右2カラムになる（幅だけが変わる） -->
  <div class="cols">
    <div class="col">
      <!-- 1. 実況・無線ログ -->
      <div class="logbox">
        <h3 class="cap">実況 / 無線</h3>
        <div class="log" id="log" aria-live="polite"></div>
      </div>

      <!-- 2. 車両情報 -->
      <div class="panel">
        <h3 class="cap">車両情報 — 神谷ハルカ（自車）</h3>
        <div class="grid" id="panel"></div>
      </div>
    </div>

    <div class="col">
      <!-- 3. コース図 -->
      <div class="track">
        <svg id="track" viewBox="0 0 400 190" role="img" aria-label="コース図と走行中の車"></svg>
        <div class="legend">
          <span><i style="background:var(--straight)"></i>ストレート</span>
          <span><i style="background:var(--fast-corner)"></i>高速</span>
          <span><i style="background:var(--slow-corner)"></i>低速</span>
          <span><b class="dot" style="background:var(--car)"></b>自車</span>
          <span><b class="dot" style="background:var(--ai)"></b>他車</span>
        </div>
      </div>

      <!-- 4. 順位表 -->
      <div class="standings">
        <h3 class="cap">順位表 <button type="button" id="standingsAll">全車</button></h3>
        <div id="standings"></div>
        <div id="standingsFull" class="full" hidden></div>
      </div>
    </div>
  </div>

  <!-- 5. 操作（両カラムの下） -->
  <div class="controls">
    <button type="button" id="btn1" class="on">1倍</button>
    <button type="button" id="btn4">4倍</button>
    <button type="button" id="btnSkip">スキップ</button>
    <button type="button" id="btnPause">一時停止</button>
    <span class="spacer"></span>
    <a href="setup.html" id="backLink">セッティングへ戻る</a>
  </div>

  <div id="resultWrap"></div>

</div></div>

<script type="module">
import {
  buildPerformance, courseLoad, createRng, formatTime, WEIGHTS, SETTINGS, isSettingUnlocked,
  RADIO, createRadioState, radioForLap, radioSymptoms, reactionFor,
  brakeThreshold, tireWearSplit, fuelLevel, fuelLapsLeft, brakeFadeLoss,
  QUALI, START,
  // 走行そのものは engine の「場の走行」。ツール（tools/simulate-season.mjs）と同じ経路を通る
  createRunner, createClock, planLap, stepField, rankRunners, progress,
  paceSpeed as paceSpeedOf, gapSeconds as gapSecondsOf,
} from '../engine/race.js';
import { loadState, save, newGame, searchWithState } from '../engine/save.js';
import { prizeFor, entryFee, sponsorFee, applyWear, condition, applyRaceWear, repairCost } from '../engine/economy.js';
import { rivalSpec, fieldEntries, rivalLoadout, aiNotes } from '../engine/rivals.js';
import { currentRound, recordResult, rivalPlanFor } from '../engine/season.js';

const SVG_NS = 'http://www.w3.org/2000/svg';
const el = (id) => document.getElementById(id);
const svgEl = (name, attrs = {}) => {
  const n = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------------------------------------------------------------------
// 演出のイベント（docs/設計/画面設計.md「演出のイベント名」）
// 音は入れない。点滅・色の切り替え・数字の確定はすべてここを通し、
// 後で音を同期できるようにしておく。名前は setup.html と共通。
// ---------------------------------------------------------------------------
function cue(name, detail = {}) {
  document.dispatchEvent(new CustomEvent('cue', { detail: { name, ...detail } }));
}

// ---------------------------------------------------------------------------
// URL パラメータ（setup.html から渡ってくる）
//   s      進行（所持金・所有・装着・シーズン）。src/engine/save.js。ブラウザストレージは使わない
//   session / course / laps / grid / seed   このレースの条件（進行ではない）
//   開発用に、s が無ければ cls / tier / parts / tp / rh / bb からも組める（legacyState）
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
/** 予選 (quali) か決勝 (race) か。予選は計測3周、ベストラップでグリッドを決める。 */
const SESSION = Q.get('session') === 'quali' ? 'quali' : 'race';
const IS_QUALI = SESSION === 'quali';
/** ゲームの進行。boot で読む。決勝が終わると収支を反映した新しい G になる */
let G = null;

/** s が無い開発用リンク（?cls=&parts=…）から進行を組む。渡されたパーツは所有扱い。 */
function legacyState(economy) {
  const ids = (Q.get('parts') ?? '').split(',').filter(Boolean);
  const settings = {};
  for (const [key, short] of Object.entries({ tire_pressure: 'tp', ride_height: 'rh', brake_bias: 'bb' })) {
    if (Q.get(short) !== null) settings[key] = Number(Q.get(short));
  }
  return {
    ...newGame(economy),
    cls: clamp(Number(Q.get('cls') ?? 2), 1, 5), tier: clamp(Number(Q.get('tier') ?? 1), 0, 4),
    owned: ids, setup: { race: { parts: ids, settings }, quali: null },
  };
}
const CLASS_CHASSIS = { 1: 'hatchback', 2: 'sedan', 3: 'sedan', 4: 'gt', 5: 'formula' };
const PROFILE = { straight: 'ストレート主体', corner: 'コーナー主体', balanced: 'バランス型',
                 fast: '高速コーナー主体', stopgo: 'ストップ＆ゴー' };
const SECTOR_LABEL = { straight: 'ストレート', fast_corner: '高速コーナー', slow_corner: '低速コーナー' };

const json = (p) => fetch(new URL(p, import.meta.url)).then((r) => {

// ---------------------------------------------------------------------------
// コース形状：courses.json の path をそのまま使う（座標系はメートル）
// ---------------------------------------------------------------------------
const VIEW = { w: 400, h: 190, margin: 16 };

function setupTrack(course) {
  const svg = el('track');
  svg.textContent = '';
  const master = svgEl('path', { d: course.path, fill: 'none', stroke: 'none' });
  svg.appendChild(master);
  S.masterPath = master;
  S.pathLen = master.getTotalLength();
  S.courseLen = course.length;
  S.ratio = S.pathLen / S.courseLen;

  const box = master.getBBox();
  const iw = VIEW.w - VIEW.margin * 2, ih = VIEW.h - VIEW.margin * 2;
  const k = Math.min(iw / box.width, ih / box.height);
  const ox = VIEW.margin + (iw - box.width * k) / 2 - box.x * k;
  const oy = VIEW.margin + (ih - box.height * k) / 2 - box.y * k;
  S.toView = (pt) => ({ x: pt.x * k + ox, y: pt.y * k + oy });

  S.sectorEls = course.sectors.map((sec) => {
    const steps = Math.max(2, Math.ceil(sec.length / 8));
    const d = [];
    for (let i = 0; i <= steps; i++) {
      const q = S.toView(rawPoint(sec.start + (sec.length * i) / steps));
      d.push(`${i ? 'L' : 'M'}${q.x.toFixed(2)} ${q.y.toFixed(2)}`);
    }
    const p = svgEl('path', {
      d: d.join(' '), fill: 'none', stroke: `var(--${sec.type.replace('_', '-')})`,
      'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-opacity': DIM_SECTOR,
    });
    svg.appendChild(p);
    return p;
  });

  const a0 = S.toView(rawPoint(0)), a1 = S.toView(rawPoint(8));
  const a = Math.atan2(a1.y - a0.y, a1.x - a0.x) + Math.PI / 2;
  svg.appendChild(svgEl('path', {
    d: `M${a0.x + Math.cos(a) * 6} ${a0.y + Math.sin(a) * 6} L${a0.x - Math.cos(a) * 6} ${a0.y - Math.sin(a) * 6}`,
    stroke: 'var(--mon-text)', 'stroke-width': 2, 'stroke-dasharray': '2 2',
  }));

  // 点は発光風：同じ色の薄い大きな円を下に重ねる（docs/設計/画面設計.md）
  const dots = svgEl('g');
  svg.appendChild(dots);
  for (const car of [...S.cars].reverse()) {
    const r = car.isPlayer ? 3.6 : 2.2;
    const g = svgEl('g');
    g.appendChild(svgEl('circle', { r: r * 2.6, fill: car.color, 'fill-opacity': car.isPlayer ? .22 : .16 }));
    g.appendChild(svgEl('circle', { r: r * 1.6, fill: car.color, 'fill-opacity': car.isPlayer ? .35 : .22 }));
    g.appendChild(svgEl('circle', { r, fill: car.color }));
    car.dotEl = g;
    dots.appendChild(g);
  }
}

/** 自車のいないセクターの濃さ。黒地なので暗く落とし、いまいるセクターだけ明るくする。 */
const DIM_SECTOR = .35;

/**
 * コースのセクターを S1 / S2 / S3 の3つに畳む（タイミングモニターの表示用）。
 * 距離で三等分しつつ、各組に最低1セクターは残す。計算には一切使わない。
 */
function buildSectorGroups(course) {
  const n = course.sectors.length;
  const groups = new Array(n);
  let g = 0, acc = 0;
  for (let i = 0; i < n; i++) {
    groups[i] = g;
    acc += course.sectors[i].length;
    const rest = n - 1 - i;
    if (g < 2 && acc >= (course.length * (g + 1)) / 3 && rest >= 2 - g) g += 1;
  }
  return groups;
}

function rawPoint(distance) {
  const d = ((distance % S.courseLen) + S.courseLen) % S.courseLen;
  return S.masterPath.getPointAtLength(d * S.ratio);
}
const pointAt = (distance) => S.toView(rawPoint(distance));

/** 自車がいるセクターだけ太く濃く。 */
function highlightSector(idx) {
  if (S.litSector === idx) return;
  S.sectorEls.forEach((p, i) => {
    p.setAttribute('stroke-width', i === idx ? 4.5 : 2);
    p.setAttribute('stroke-opacity', i === idx ? 1 : DIM_SECTOR);
  });
  S.litSector = idx;
}

// 出走車
// ---------------------------------------------------------------------------
/**
 * 名簿の1行から AI 車を組む。中身（性能・ドライバー・語り口）は src/engine/rivals.js。
 * ここでは描画と走行の状態を足すだけ。
 */
function makeRival(entry, i, ctx) {
  const spec = rivalSpec(entry, i, ctx);
  return makeCar({ ...spec, color: 'var(--ai)', seed: ctx.baseSeed + i * 977 });
}

function makeCar({ id, name, short = name, number = null, color, perf, driver, seed, isPlayer = false, radio = null }) {
  return {
    // 走行の状態は engine が持つ（タイヤ・ブレーキ・燃料・計画・周回・リタイア）
    ...createRunner({ perf, driver, seed, laps: S.totalLaps }),
    id, name, short, number, color, isPlayer, radio,
    sectorBest: [], announcedRetire: false,
    lastRank: null, lastGap: null, lastGapAhead: null, nearestId: null,
    // タイミングモニターの S1/S2/S3（表示専用）。いま積んでいる分、直近の確定値、
    // その車の自己ベスト、色（green=自己ベスト更新 / yellow=届かず / purple=全体ベスト）
    groupNow: [0, 0, 0], groupLast: [null, null, null],
    groupBest: [Infinity, Infinity, Infinity], groupState: ['', '', ''],
    rollFrom: null, rollAt: 0,   // ラップタイムの数字回転
  };
}

/** ラップタイムが回っている最中の表示値。回っていなければ確定値をそのまま返す。 */
const ROLL_MS = 600;
function lapDisplay(car, now = performance.now()) {
  const to = car.lapTimes.at(-1);
  if (to == null) return null;
  if (car.rollFrom == null) return to;
  const t = (now - car.rollAt) / ROLL_MS;
  if (t >= 1) { car.rollFrom = null; cue('number.settle', { car: car.id, to }); return to; }
  const e = 1 - Math.pow(1 - t, 3);
  return car.rollFrom + (to - car.rollFrom) * e;
}

/**
 * S1/S2/S3 の1つを確定する。自己ベストを更新したら緑、全体ベストなら紫、届かなければ黄。
 * 1周目は比べる相手がいないので、その車にとっては必ず更新＝緑になる（実際のタイミング画面と同じ）。
 */
function finalizeGroup(car, g) {
  const time = car.groupNow[g];
  car.groupNow[g] = 0;
  if (!(time > 0)) return;
  car.groupLast[g] = time;
  let state = 'yellow';
  if (time < S.groupBestAll[g]) {
    S.groupBestAll[g] = time;
    state = 'purple';
  } else if (time < car.groupBest[g]) {
    state = 'green';
  }
  if (time < car.groupBest[g]) car.groupBest[g] = time;
  car.groupState[g] = state;
  if (car.isPlayer && !S.skipping) cue(`sector.${state}`, { group: g + 1, time });
}

/**
 * 走行は engine に任せ、画面はここで結果を受け取る（src/engine/race.js「場の走行」）。
 *   onSector  S1/S2/S3 の確定と、自車のセクター通過（反応層の無線）
 *   onLap     ラップタイムの数字回転と、周ごとの無線・実況
 */
const HOOKS = {
  options: { quali: IS_QUALI },
  onSector(car, idx, time) {
    // タイミングモニターの S1/S2/S3：組が変わる手前（＝周の最後を含む）で確定する。
    // 実測の時間を積むので、S1+S2+S3 は LAST とぴったり一致する
    const g = S.sectorGroup[idx];
    car.groupNow[g] += time;
    if (S.sectorGroup[idx + 1] !== g) finalizeGroup(car, g);
    if (car.isPlayer) {
      const best = car.sectorBest[idx] ?? Infinity;
      S.sectorEvents.push({ idx, type: S.course.sectors[idx].type, time, best });
      if (time < best) car.sectorBest[idx] = time;
    }
  },
  onLap(car, event) {
    // ラップタイムは前の周の値から回して確定する（スキップ中は回さない）
    car.rollFrom = S.skipping ? null : event.prev;
    car.rollAt = performance.now();
    if (car.rollFrom != null && car.isPlayer) cue('lap.set', { from: car.rollFrom, to: event.lapTime });
    S.lapEvents.push(event);
  },
};

const paceSpeed = (car) => paceSpeedOf(car, S.courseLen);
const gapSeconds = (ahead, behind) => gapSecondsOf(ahead, behind, S.courseLen);

// ---------------------------------------------------------------------------
// ログ（実況と無線を同じ流れに。話者で見分ける）
// ---------------------------------------------------------------------------
const LOG_KEEP = 40;    // DOM に残す本数
const LOG_FRESH = 8;    // 濃く表示する本数。それより古いものは薄く
const SPEAKER_LABEL = { announcer: '実況', analyst: '解説', haruka: 'ハルカ', player: 'ピット' };

const textOf = (entry) => (typeof entry === 'string' ? entry : entry.text);

/** 配列から1本引く。 */
const pick = (list) => list[Math.floor(S.lineRng() * list.length)];

/**
 * 同じ台詞を1レースで繰り返さない引き方。使い切ったら忘れて最初から。
 * key はプールの名前（"commentary/lap_lead/announcer" など）。
 */
function pickUnique(key, list) {
  let used = S.used.get(key);
  if (!used || used.size >= list.length) { used = new Set(); S.used.set(key, used); }
  const candidates = list.map((e, i) => i).filter((i) => !used.has(i));
  const i = candidates[Math.floor(S.lineRng() * candidates.length)];
  used.add(i);
  return list[i];
}

/** 反応層・常時層で直近に出した台詞。この中にあるものは引かない（docs/設計/無線.md） */
const RECENT_KEEP = 5;

/**
 * 反応層・常時層用。pickUnique に加えて、直近 RECENT_KEEP 本と同じ文は避ける。
 * プールが小さくて使い切っても、直前に言ったばかりの文が続けて出ないようにする。
 * 全部が直近と重なるときだけ諦めて pickUnique の結果をそのまま使う。
 */
function pickFresh(key, list) {
  const recent = S.recent;
  const fresh = list.filter((e) => !recent.includes(textOf(e)));
  const pool = fresh.length ? fresh : list;
  const e = pool.length === list.length ? pickUnique(key, list) : pick(pool);
  recent.push(textOf(e));
  if (recent.length > RECENT_KEEP) recent.shift();
  return e;
}

/** {gap} {car} {lap} … をその場の値で埋める。 */
function fill(text, vars) {
  return text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}

/**
 * ログに1本足す。
 * @param {string} speaker  announcer / analyst / haruka / player
 * @param {string} text
 * @param {object} [opt]    { info: true, mood, replies: [{label, reactions, consistency}] }
 */
function say(speaker, text, opt = {}) {
  // スキップ中に通すのは、症状（情報系）と、結果が確定したあとの実況だけ。
  // 常時層・反応層・雑談・解説はここで落とす（各層の入口ではなく1箇所で止める）。
  if (S.skipping && !opt.allowInSkip) return;
  const entry = { speaker, text, info: !!opt.info, mood: opt.mood ?? null, replies: opt.replies ?? [], answer: null, id: S.logSeq++ };
  S.log.push(entry);
  if (S.log.length > LOG_KEEP) S.log.splice(0, S.log.length - LOG_KEEP);
  // 返事の選択肢は最新の情報系にだけ付ける。前の分は消す
  if (entry.info) for (const e of S.log) if (e !== entry && e.info && !e.answer) e.replies = [];
  S.logDirty = true;
}

function renderLog() {
  if (!S.logDirty) return;
  S.logDirty = false;
  const box = el('log');
  const freshFrom = Math.max(0, S.log.length - LOG_FRESH);
  box.innerHTML = S.log.map((e, i) => {
    const replies = e.replies.length && !e.answer
      ? `<div class="replies">${e.replies.map((r, j) => `<button type="button" data-id="${e.id}" data-r="${j}">${esc(r.label)}</button>`).join('')}</div>`
      : '';
    const answer = e.answer ? `<div class="answer"><span class="k">ピット→</span>${esc(e.answer.label)}　<span class="k">ハルカ：</span>${esc(e.answer.reaction)} <span class="note">${esc(e.answer.note)}</span></div>` : '';
    // 表情（mood）はエントリに持ったまま表示しない。
    // 文字で「不機嫌」と書くより顔の差分で見せるものなので、絵が入るまで出さない
    const mood = '';
    return `<div class="msg${e.info ? ' info' : ''}${i < freshFrom ? ' old' : ''}" data-speaker="${e.speaker}">
      <span class="who">${SPEAKER_LABEL[e.speaker] ?? e.speaker}</span>
      <span class="txt">${esc(e.text)}${mood}${replies}${answer}</span>
    </div>`;
  }).join('');
  // 返事の3択が付く行は、この時点の scrollHeight より後に高さが決まることがある。
  // 次のフレームでもう一度下げないと、いちばん新しい一言が半分隠れる
  box.scrollTop = box.scrollHeight;
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

el('log').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-id]');
  if (!btn) return;
  const entry = S.log.find((e) => e.id === Number(btn.dataset.id));
  if (!entry) return;
  answer(entry, entry.replies[Number(btn.dataset.r)]);
});

/** 返事。セッティングは動かない。動くのはハルカの調子だけ。 */
function answer(entry, reply) {
  const driver = S.cars[0].driver;
  let note = '';
  if (reply.consistency) {
    const before = driver.consistency;
    driver.consistency = clamp(before + reply.consistency, 20, 95);
    const d = driver.consistency - before;
    if (d) note = `（調子 ${d > 0 ? '+' : ''}${d}）`;
  }
  entry.answer = { label: reply.label, reaction: textOf(pick(reply.reactions)), note };
  entry.replies = [];
  S.logDirty = true;
  renderLog();
}

// ---------------------------------------------------------------------------
// 無線（docs/設計/無線.md）。4層。
//   常時：数秒に1本、ピット（主人公）からの自動コールとハルカの状態の一言
//   反応：セクター通過ごとに高確率で一言
//   情報系：症状が続く間くり返す。悪化で口調がきつくなる。判定は race.js
//   雑談：情報系の隙間に
// ---------------------------------------------------------------------------
function avgSpeedByType(car) {
  const out = { straight: 0, corner: 0 };
  if (!car.plan) return out;
  let sLen = 0, cLen = 0;
  car.plan.forEach((seg, i) => {
    if (S.course.sectors[i].type === 'straight') { out.straight += seg.speed * seg.len; sLen += seg.len; }
    else { out.corner += seg.speed * seg.len; cLen += seg.len; }
  });
  if (sLen) out.straight /= sLen;
  if (cLen) out.corner /= cLen;
  return out;
}

/** 順位の絡む症状。engine には無い情報なので、ここで作って渡す。ついでに実況の順位・ギャップ変動も拾う。 */
function trafficForPlayer() {
  const me = S.cars[0];
  const list = ranked();
  const idx = list.indexOf(me);
  const rank = idx + 1;
  const t = { overtook: false, overtaken: false, straightLoss: false, cornerLoss: false, rank, gapAheadDelta: null };

  if (me.lastRank != null && !me.finished) {
    if (rank < me.lastRank) t.overtook = true;
    else if (rank > me.lastRank) t.overtaken = true;
  }
  me.lastRank = rank;

  const ahead = list[idx - 1];
  if (ahead && !ahead.retired) {
    const gap = gapSeconds(ahead, me);
    if (me.lastGapAhead != null) t.gapAheadDelta = gap - me.lastGapAhead;
    me.lastGapAhead = gap;
    t.gapAhead = gap;
    t.aheadCar = ahead;
  } else me.lastGapAhead = null;

  const behind = list[idx + 1];
  if (behind && !behind.retired) {
    const gap = progress(me, S.courseLen) - progress(behind, S.courseLen);
    if (me.lastGap != null && gap < me.lastGap - 5) {
      const mine = avgSpeedByType(me), theirs = avgSpeedByType(behind);
      const dStraight = theirs.straight - mine.straight;
      const dCorner = theirs.corner - mine.corner;
      if (dStraight > 0 && dStraight >= dCorner) t.straightLoss = true;
      else if (dCorner > 0) t.cornerLoss = true;
    }
    me.lastGap = gap;
    me.nearestId = behind.id;
  }
  return t;
}

/** 雑談を1本。近くに他車がいれば、その車の性格に触れる。 */
function chatLine() {
  const chat = S.radioData.chat;
  const me = S.cars[0];
  const near = S.cars.find((c) => c.id === me.nearestId && !c.retired);
  const gap = near ? Math.abs(progress(me, S.courseLen) - progress(near, S.courseLen)) : Infinity;

  if (near && gap < 60 && S.lineRng() < 0.5) {
    const pool = (S.metRivals.has(near.id) ? chat.ai.rival : chat.ai[near.radio]) ?? chat.ai.rival;
    S.metRivals.add(near.id);
    return { text: textOf(pickUnique(`chat/ai/${near.id}`, pool)), replies: [] };
  }
  if (S.lineRng() < 0.05) return { text: textOf(pick(chat.rare)), replies: [] };
  if (IS_QUALI && chat.quali?.length && S.lineRng() < 0.6) return { text: textOf(pickUnique('chat/quali', chat.quali)), replies: [] };
  if (S.lineRng() < 0.25) {
    const entry = pickUnique('chat/with_reply', chat.with_reply);
    return { text: entry.text, replies: entry.replies };
  }
  return { text: textOf(pickUnique('chat/general', chat.general)), replies: [] };
}

/** 情報系。level が harsh なら悪化版の台詞（無ければ通常版）。 */
function sayInfo(call, opt = {}) {
  const def = S.radioData.info[call.id];
  if (!def) return;
  // スキップ中は溜めておき、同じトリガーは1本にまとめる（悪化版が来たらそちらで上書き）
  if (S.skipping && !opt.flush) {
    const prev = S.skipInfo.get(call.id);
    if (!prev || (call.level === 'harsh' && prev.level !== 'harsh')) S.skipInfo.set(call.id, call);
    S.lastInfoLap = call.lap;
    return;
  }
  const pool = call.level === 'harsh' && def.harsh?.length ? def.harsh : def.lines;
  say('haruka', textOf(pickUnique(`info/${call.id}/${call.level}`, pool)), {
    // 返事は共通の3択。燃料切れだけは専用の1つ（data/radio.json の info.fuel_out.replies）
    info: true, mood: def.mood, replies: def.replies ?? S.radioData.replies, allowInSkip: true,
  });
  S.lastInfoLap = call.lap;
}

/** 溜めた症状を、起きた順（同じ周なら優先順）に1本ずつ出す。スキップの結末を出す直前に呼ぶ。 */
function flushSkipInfo() {
  if (!S.skipInfo.size) return;
  const calls = [...S.skipInfo.values()]
    .sort((a, b) => a.lap - b.lap || RADIO.priority.indexOf(a.id) - RADIO.priority.indexOf(b.id));
  S.skipInfo.clear();
  for (const call of calls) sayInfo(call, { flush: true });
}

/** 反応層：セクター通過ごと。倍速では間引く。スキップ中は出さない。 */
function reactionTick() {
  const events = S.sectorEvents;
  S.sectorEvents = [];
  if (S.skipping || !S.radioData) return;
  const chance = RADIO.reaction.chance / (S.speed >= 4 ? RADIO.constant.thinAtFast : 1);
  for (const ev of events) {
    const r = reactionFor(ev, S.radioRng, chance);
    if (!r) continue;
    const R = S.radioData.reaction;
    // 予選のアタック中は専用の台詞（「今の区間、いい」）。それ以外は通常の反応
    const attacking = IS_QUALI && S.cars[0].lap === QUALI.attackLap - 1;
    if (attacking && r.sentiment !== 'neutral') {
      const pool = r.sentiment === 'good' ? S.radioData.quali.attack_good : S.radioData.quali.attack_bad;
      say('haruka', textOf(pickFresh(`quali/${r.sentiment}`, pool)));
      continue;
    }
    // 型ごとの一言（「伸びろ」「立ち上がり」）は、良し悪しの無い周に混ぜる
    const pool = r.sentiment === 'neutral' && S.lineRng() < 0.5 ? R[ev.type] : R[r.sentiment];
    say('haruka', textOf(pickFresh(`reaction/${r.sentiment}/${ev.type}`, pool)));
  }
}

/** 常時層：走行 intervalSec 秒ごとに1本。ピット（主人公）とハルカを交互に。 */
function constantTick(dt) {
  if (S.skipping || S.done) return;
  S.constantClock += dt;
  const interval = RADIO.constant.intervalSec * (S.speed >= 4 ? RADIO.constant.thinAtFast : 1);
  if (S.constantClock < interval) return;
  S.constantClock = 0;

  const me = S.cars[0];
  if (me.finished || me.retired) return;
  if (IS_QUALI) {
    // 予選：アタック中に前が近ければ「前に遅いのがいる」。それ以外は状態の一言
    const attacking = me.lap === QUALI.attackLap - 1;
    const byPos = [...S.cars].filter((c) => !c.retired && c !== me);
    const near = byPos.find((c) => { const g = gapSeconds(c, me); return g > 0 && g < 3; });
    if (attacking && near && !S.qualiTrafficSaid) {
      S.qualiTrafficSaid = true;
      say('haruka', textOf(pickUnique('quali/traffic', S.radioData.quali.traffic)));
    } else if (S.lineRng() < 0.5) {
      say('haruka', textOf(pickFresh('constant/haruka', S.radioData.constant.haruka)));
    }
    return;
  }
  const P = S.radioData.constant.player;
  const list = ranked();
  const idx = list.indexOf(me);
  const ahead = list[idx - 1], behind = list[idx + 1];
  const left = S.totalLaps - me.lap;
  const vars = { pos: idx + 1, left, lap: me.lap + 1, laps: S.totalLaps };

  // 何を言うか：状況が切迫しているものから
  let key = null;
  if (ahead && !ahead.retired && gapSeconds(ahead, me) < 4) { key = 'gap_ahead'; vars.gap = `${gapSeconds(ahead, me).toFixed(1)}秒`; vars.car = ahead.name; }
  else if (behind && !behind.retired && gapSeconds(me, behind) < 2.5) { key = 'gap_behind'; vars.gap = `${gapSeconds(me, behind).toFixed(1)}秒`; vars.car = behind.name; }
  else if (left <= 3 && me.lap !== S.lastLapsLeftCall && left > 1) { key = 'laps_left'; S.lastLapsLeftCall = me.lap; }
  else if (idx === 0 && S.lineRng() < 0.5) key = 'leader';
  else if (behind && !behind.retired && S.lineRng() < 0.3) { key = 'gap_behind_safe'; vars.gap = `${gapSeconds(me, behind).toFixed(1)}秒`; }
  else if (me.lapTimes.length && S.lineRng() < 0.35) { key = 'lap_time'; vars.time = formatTime(me.lapTimes.at(-1)); vars.best = formatTime(me.best); }
  else if (S.lineRng() < 0.3) key = 'position';

  // 主人公とハルカを交互に。主人公に言うことが無ければハルカ
  S.constantTurn = (S.constantTurn + 1) % 2;
  if (key && (S.constantTurn === 0 || S.lineRng() < 0.4)) {
    if (key === 'position') { vars.car = ahead?.name ?? '—'; }
    say('player', fill(textOf(pickFresh(`constant/${key}`, P[key])), vars));
  } else if (S.lineRng() < 0.35) {
    say('player', textOf(pickFresh('constant/encourage', P.encourage)));
  } else {
    say('haruka', textOf(pickFresh('constant/haruka', S.radioData.constant.haruka)));
  }
}

// ---------------------------------------------------------------------------
// 実況（docs/設計/実況.md）。data/commentary.json
//   アナウンサーは事実、解説は理屈。神谷の車の解説は、ハルカの無線が出ていない周に。
// ---------------------------------------------------------------------------
const FINAL_TRIGGERS = new Set(['checkered', 'pole', 'quali_end']);
/**
 * @param {string[]} [tags] その場で成り立っている条件（'win' など）。
 *   台詞に `when` があるものは、その条件が立っているときだけ選ばれる。
 *   `when` の無い台詞は常に選ばれる。順位と食い違う実況を出さないための仕掛け。
 */
function commentary(trigger, speaker, vars = {}, tags = []) {
  // スキップ中は途中の実況を出さない。結果が確定した後の実況（チェッカー、ポール、予選終了）だけ残す
  if (S.skipping && !FINAL_TRIGGERS.has(trigger)) return;
  const all = S.commentary.triggers[trigger]?.[speaker];
  if (!all?.length) return;
  const pool = all.filter((e) => typeof e === 'string' || !e.when || tags.includes(e.when));
  if (!pool.length) return;
  // ここに来る時点で、スキップ中なら結果確定後の実況だけに絞られている
  say(speaker, fill(textOf(pickUnique(`commentary/${trigger}/${speaker}/${tags.join('+')}`, pool)), vars), { allowInSkip: true });
}

function baseVars() {
  const list = ranked();
  const me = S.cars[0];
  return {
    course: S.course.name, length: S.course.length.toLocaleString('ja-JP'), laps: S.totalLaps,
    cars: S.cars.length, rivals: S.cars.length - 1,
    leader: list[0]?.name ?? '—', pos: list.indexOf(me) + 1,
    lap: Math.min((list[0]?.lap ?? 0) + 1, S.totalLaps), left: S.totalLaps - (list[0]?.lap ?? 0),
  };
}

/** 周が終わるたび（どの車でも）。先頭通過、ベストラップ、自車の順位・ギャップの変動、解説。 */
function lapCommentary(ev, traffic) {
  const vars = baseVars();
  const car = ev.car;

  // ベストラップ（レース全体で最速）。1周目はまだ比べる相手がいない
  if (Number.isFinite(S.raceBest) && ev.lapTime < S.raceBest) {
    commentary('best_lap', 'announcer', { ...vars, car: car.name, time: formatTime(ev.lapTime) });
    if (car.isPlayer) say('player', fill(textOf(pickFresh('constant/best_lap', S.radioData.constant.player.best_lap)), { time: formatTime(ev.lapTime) }));
    if (S.lineRng() < 0.4) commentary('best_lap', 'analyst', vars);
  }
  if (ev.lapTime < S.raceBest) S.raceBest = ev.lapTime;

  // 先頭の通過。最終周はその旨
  const leaderLap = Math.max(...S.cars.map((c) => c.lap));
  if (leaderLap > S.leaderLap) {
    S.leaderLap = leaderLap;
    if (leaderLap === S.totalLaps - 1) {
      commentary('final_lap', 'announcer', vars);
      say('player', textOf(pickFresh('constant/final_lap', S.radioData.constant.player.final_lap)));
      commentary('final_lap', 'analyst', vars);
    } else if (leaderLap < S.totalLaps - 1) {
      commentary('lap_lead', 'announcer', { ...vars, lap: leaderLap + 1, left: S.totalLaps - leaderLap });
      analystOnLap(leaderLap);
    }
  }

  if (!car.isPlayer || !traffic) return;
  if (traffic.overtook || traffic.overtaken) {
    commentary('position_change', 'announcer', { ...vars, car: car.name, pos: traffic.rank });
    if (S.lineRng() < 0.5) commentary('position_change', 'analyst', vars);
  } else if (traffic.gapAheadDelta != null && Math.abs(traffic.gapAheadDelta) >= 0.8
             && !car.finished && traffic.aheadCar && !traffic.aheadCar.finished) {
    const key = traffic.gapAheadDelta < 0 ? 'gap_shrink' : 'gap_grow';
    commentary(key, 'announcer', { ...vars, car: car.name, pos: traffic.rank, gap: traffic.gapAhead.toFixed(1) });
    if (S.lineRng() < 0.5) commentary(key, 'analyst', vars);
  }
}

/** 解説の周ごとの一言。他車の性格か、神谷の車の症状（無線と重ならない周だけ）。 */
function analystOnLap(lap) {
  if (lap % 2 === 0) return;   // 毎周は喋らない
  const me = S.cars[0];
  const C = S.commentary;
  const canTalkPlayer = S.lastInfoLap !== lap && S.lastInfoLap !== lap - 1;
  if (canTalkPlayer && S.lineRng() < 0.5 && S.lastSnapshot) {
    const symptoms = radioSymptoms(me.perf, S.lastSnapshot);
    const id = RADIO.priority.find((k) => symptoms[k] !== undefined && C.analyst_player[k]);
    const pool = C.analyst_player[id ?? 'clean'];
    say('analyst', textOf(pickUnique(`analyst_player/${id ?? 'clean'}`, pool)));
    return;
  }
  const ai = S.cars.filter((c) => !c.isPlayer && !c.retired && C.analyst_traits[c.radio]);
  if (ai.length && S.lineRng() < 0.6) {
    const car = pick(ai);
    say('analyst', fill(textOf(pickUnique(`analyst_traits/${car.radio}`, C.analyst_traits[car.radio])), { car: car.name }));
  } else if (S.lineRng() < 0.5) {
    commentary('lap_lead', 'analyst', baseVars());
  }
}

/** 終わった周ぶんの無線と実況を処理する。 */
function lapTick() {
  if (!S.lapEvents.length) return;
  const events = S.lapEvents;
  S.lapEvents = [];
  for (const ev of events) {
    let traffic = null;
    if (ev.car.isPlayer) {
      traffic = trafficForPlayer();
      ev.traffic = traffic;
      S.lastSnapshot = ev;
      const calls = radioForLap(ev.car.perf, ev, S.radio, S.radioRng);
      for (const call of calls) {
        if (call.kind === 'info') S.symptoms[call.id] = (S.symptoms[call.id] ?? 0) + 1;
        if (call.kind === 'chat') {
          const line = chatLine();
          say('haruka', line.text, {
            replies: (line.replies ?? []).map((r) => ({ label: r.label, reactions: [r.answer], consistency: 0 })),
          });
        } else sayInfo(call);
      }
    }
    if (IS_QUALI) qualiLapCommentary(ev);
    else lapCommentary(ev, traffic);
  }
}

// ---------------------------------------------------------------------------
// 予選（QUALI）。アウトラップ → アタック → インラップ。暫定トップの更新を実況し、
// 終わったらポールと確定順を出してグリッドを決勝へ渡す。
// ---------------------------------------------------------------------------
function qualiLapCommentary(ev) {
  const car = ev.car;
  const vars = baseVars();
  const lapNo = ev.lap;
  if (lapNo === QUALI.attackLap) {
    // アタックラップのタイムだけが暫定トップの対象
    if (ev.lapTime < S.qualiBest) {
      S.qualiBest = ev.lapTime;
      S.qualiTop = car;
      commentary('provisional_top', 'announcer', { ...vars, car: car.name, time: formatTime(ev.lapTime) });
      if (S.lineRng() < 0.4) commentary('provisional_top', 'analyst', vars);
    }
    if (car.isPlayer) say('haruka', textOf(pickUnique('quali/done', S.radioData.quali.done)));
  }
  if (car.isPlayer && lapNo === QUALI.attackLap - 1) say('haruka', textOf(pickUnique('quali/attack_start', S.radioData.quali.attack_start)));
  if (car.isPlayer && lapNo === QUALI.attackLap) say('haruka', textOf(pickUnique('quali/in', S.radioData.quali.in)));
}

/** 予選終了。グリッドを並べ、決勝へのリンクを出す。 */
function qualiFinish() {
  const list = ranked();
  const pole = list[0];
  const vars = { ...baseVars(), car: pole.name, time: formatTime(pole.best), pos: list.indexOf(S.cars[0]) + 1,
    gap: list[1] ? (list[1].best - pole.best).toFixed(3) : '0.000', laps: Q.get('laps') ?? 10 };
  commentary('pole', 'announcer', vars);
  commentary('quali_end', 'announcer', vars);
  commentary('quali_end', 'analyst', vars);

  const grid = list.map((c) => c.id).join(',');
  const common = { course: S.course.id, laps: Q.get('laps') ?? 10, grid };
  const q = searchWithState(G, { ...common, session: 'race' }).slice(1);
  const back = searchWithState(G, { ...common, session: 'quali' }).slice(1);
  el('resultWrap').innerHTML = `<div class="result"><h3 class="cap">予選結果 — スターティンググリッド</h3>${list.map((car, i) => `
    <div class="rrow ${car.isPlayer ? 'me' : ''}">
      <span class="pos">${i + 1}</span>
      <span>${esc(car.name)}<div class="sub">${i === 0 ? 'ポールポジション' : `トップとの差 +${(car.best - pole.best).toFixed(3)}`}</div></span>
      <span class="t"><b>${Number.isFinite(car.best) ? formatTime(car.best) : '—'}</b></span>
    </div>`).join('')}
    <div class="controls" style="padding:8px">
      <a class="btn primary" href="race.html?${q}">決勝へ（このグリッドで）</a>
      <a class="btn" href="setup.html?${back}">決勝のセッティングを見直す</a>
    </div></div>`;
}

/** リタイアした車を実況する。 */
function retireTick() {
  for (const car of S.cars) {
    if (car.retired && !car.announcedRetire) {
      car.announcedRetire = true;
      // 自車が燃料で止まったら、実況より先にハルカ。判定は race.js に任せる
      if (car.isPlayer && car.retireReason === 'fuel') {
        const calls = radioForLap(car.perf, {
          lap: car.retiredLap, tire: car.tire, brake: car.brake, fuel: car.fuel,
          driver: car.driver, stopped: true,
        }, S.radio, S.radioRng);
        for (const call of calls) { S.symptoms[call.id] = (S.symptoms[call.id] ?? 0) + 1; sayInfo(call); }
      }
      // 機械的なリタイアと燃料切れで実況を選び分ける（熱と耐久の話を燃料に使わない）
      const tags = [car.retireReason === 'fuel' ? 'fuel' : 'mechanical'];
      commentary('retire', 'announcer', { ...baseVars(), car: car.name, lap: car.retiredLap }, tags);
      if (S.lineRng() < 0.6) commentary('retire', 'analyst', baseVars(), tags);
    }
  }
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
const S = {
  cars: [], course: null, load: null, totalLaps: 10,
  masterPath: null, pathLen: 0, courseLen: 0, ratio: 1, toView: (p) => p, sectorEls: [], litSector: -1,
  speed: 1, paused: false, done: false, skipping: false, skipInfo: new Map(), last: 0, raf: 0,
  radioData: null, commentary: null, radio: null, radioRng: null, lineRng: null,
  lapEvents: [], sectorEvents: [], metRivals: new Set(), used: new Map(),
  log: [], logSeq: 0, logDirty: false, lastInfoLap: -9, lastSnapshot: null,
  recent: [],   // 反応層・常時層で直近に出した台詞（pickFresh）
  constantClock: 0, constantTurn: 0, lastLapsLeftCall: -1,
  raceBest: Infinity, leaderLap: 0, panelClock: 0,
  clock: createClock(), gridStart: false, qualiBest: Infinity, qualiTop: null, qualiTrafficSaid: false,
  // タイミングモニター：セクター → S1/S2/S3 の対応と、全車を通した各組のベスト（紫）
  sectorGroup: [], groupBestAll: [Infinity, Infinity, Infinity],
  // ゲージの警戒段階と、前との差の増減。どちらも「変わった瞬間」を拾うために前回値を持つ
  gaugeState: { tire: '', brake: '', fuel: '' }, gapShown: null, gapCue: null,
  symptoms: {},   // この戦で自車に出た情報系トリガー → 回数（シーズンのノート用）
  checkeredClass: '',
};

async function boot() {
  const [parts, chassisData, courses, drivers, radioData, commentaryData, rivals, economy, sponsors, playerNotes, aiBaseline] = await Promise.all([
    json('../../data/parts.json'), json('../../data/chassis.json'),
    json('../../data/courses.json'), json('../../data/drivers.json'),
    json('../../data/radio.json'), json('../../data/commentary.json'), json('../../data/rivals.json'),
    json('../../data/economy.json'), json('../../data/sponsors.json'), json('../../data/notes.json'),
    json('../../data/ai-baseline.json'),
  ]);
  S.economy = economy;
  S.sponsors = sponsors;
  G = loadState(location.search) ?? legacyState(economy);

  const course = courses.find((c) => c.id === Q.get('course')) ?? courses[0];
  const cls = clamp(Number(G.cls ?? 1), 1, 5);
  const tier = clamp(Number(G.tier ?? 0), 0, 4);
  S.cls = cls;
  const chassis = chassisData[CLASS_CHASSIS[cls]];
  S.totalLaps = clamp(Number(Q.get('laps') ?? 10), 1, 60);
  S.course = course;
  S.load = courseLoad(course);

  // 予選なら予選用のセッティング。無ければ決勝用と同じ。持っていない・規定外のパーツは落とす
  const setup = (IS_QUALI && G.setup?.quali) ? G.setup.quali : (G.setup?.race ?? { parts: [], settings: {} });
  const mine = (setup.parts ?? []).map((id) => parts.find((p) => p.id === id))
    .filter((p) => p && G.owned.includes(p.id) && p.class_required <= cls && p.sponsor_tier <= tier);
  const settings = {};
  for (const [key, def] of Object.entries(SETTINGS)) {
    const raw = setup.settings?.[key];
    if (raw !== null && raw !== undefined && isSettingUnlocked(def, mine)) settings[key] = Number(raw);
  }
  if (IS_QUALI) S.totalLaps = QUALI.laps;
  const driver = { ...drivers[0] };
  // 自車は耐久ぶん効果を縮めた写しで走る。AI は同じ構成を借りるが消耗は借りない（毎レース新品）
  const mineWorn = mine.map((p) => applyWear(economy, p, condition(G, p)));
  const myPerf = buildPerformance(mineWorn, driver, chassis, settings);
  S.mine = mine;
  S.myPerf = myPerf;

  // AI が見る基準：親父のノート＋クラス5の内部基準。プレイヤー側の画面（setup.html）は
  // notes.json しか読まないので、「ノート通りにする」はクラス5では出ない
  const notes = aiNotes(playerNotes, aiBaseline);

  const baseSeed = Number(Q.get('seed') ?? 20260912);
  const aiRng = createRng(baseSeed);
  // 出走台数はコース × クラスで決まる（courses.json の grid）。名簿の先頭から自車ぶんを除いて使う。
  // AI の構成は自車と無関係。シーズンの種（無ければこのレースの種）から固定で決まる（rivals.js）
  const entries = fieldEntries(rivals, course, cls);
  const plan = rivalPlanFor({ rivalSeed: G.season?.rivalSeed ?? baseSeed }, entries, parts, cls);
  const ai = entries.map((entry, i) => makeRival(entry, i, {
    loadout: rivalLoadout(entry, i, plan, parts, notes, course, cls), driver, chassis, rng: aiRng, baseSeed,
  }));

  S.cars = [
    makeCar({ id: 'me', name: '神谷ハルカ', short: '神谷', color: 'var(--car)', perf: myPerf, driver, seed: baseSeed + 7, isPlayer: true }),
    ...ai,
  ];

  // --- グリッド（予選結果）。'last' は予選なし＝最後尾 --------------------
  const gridParam = Q.get('grid');
  if (!IS_QUALI && gridParam) {
    const byId = Object.fromEntries(S.cars.map((c) => [c.id, c]));
    let order = gridParam === 'last'
      ? [...S.cars.filter((c) => !c.isPlayer), S.cars[0]]
      : gridParam.split(',').map((id) => byId[id]).filter(Boolean);
    for (const c of S.cars) if (!order.includes(c)) order.push(c);   // 名簿に無い id は後ろへ
    order.forEach((c, i) => { c.gridPos = i + 1; c.delay = i * START.slotDelay; });
    S.gridStart = true;
  }

  S.sectorGroup = buildSectorGroups(course);
  setupTrack(course);
  el('courseName').textContent = course.name;
  el('courseProf').textContent = `${PROFILE[course.profile] ?? ''}・1周 ${course.length.toLocaleString('ja-JP')} m・${S.totalLaps} 周・${S.cars.length} 台`;
  el('backLink').href = `setup.html${searchWithState(G, { course: course.id, laps: S.totalLaps, session: SESSION, grid: Q.get('grid') })}`;
  if (IS_QUALI) {
    document.title = '予選 — ハルカのセッティングノート';
    el('courseName').textContent = `${course.name}（予選）`;
    el('courseProf').textContent = `計測 ${QUALI.laps} 周：アウト → アタック → イン・${S.cars.length} 台`;
  } else if (S.gridStart) {
    el('courseProf').textContent += `・${S.cars[0].gridPos} 番グリッド`;
  }

  // --- 無線と実況 ---------------------------------------------------------
  S.radioData = radioData;
  S.commentary = commentaryData;
  S.radio = createRadioState();
  S.radioRng = createRng(baseSeed + 101);   // 出す／出さないの判断
  S.lineRng = createRng(baseSeed + 202);    // どの台詞を引くか

  for (const car of S.cars) planLap(car, course, HOOKS.options);
  const vars = baseVars();
  if (IS_QUALI) {
    commentary('quali_start', 'announcer', vars);
    commentary('quali_start', 'analyst', vars);
    say('haruka', textOf(pickUnique('quali/out', radioData.quali.out)));
  } else {
    commentary('race_start', 'announcer', vars);
    say('announcer', textOf(pickUnique('profile', commentaryData.profile)));
    // スポンサーが付いていれば、その名前で紹介する（段階0のあいだは何も言わない）
    const sponsor = G.sponsor && sponsors.find((sp) => sp.id === G.sponsor.id);
    if (sponsor) {
      commentary('sponsor_intro', 'announcer', { ...vars, sponsor: sponsor.name });
      if (S.lineRng() < 0.5) commentary('sponsor_intro', 'analyst', { ...vars, sponsor: sponsor.name });
    }
    commentary('race_start', 'analyst', vars);
    const intro = radioData.chat.course_start[course.id];
    if (intro) say('haruka', textOf(pick(intro)));
  }

  renderStandings();
  renderPanel();
  renderLog();
  S.last = performance.now();
  S.raf = requestAnimationFrame(tick);
}

// ---------------------------------------------------------------------------
// ループ
// ---------------------------------------------------------------------------
function tick(now) {
  const dt = Math.min((now - S.last) / 1000, 0.1);
  S.last = now;
  if (!S.paused && !S.done) {
    step(dt * S.speed);
    renderStandings();
    S.panelClock += dt;
    // ラップタイムが回っている間はパネルも毎フレーム描き直す（数字が滑らかに止まる）
    const rolling = S.cars[0].rollFrom != null;
    if (S.panelClock > 0.25 || rolling) { S.panelClock = 0; renderPanel(); }
  }
  renderLog();
  draw();
  S.raf = requestAnimationFrame(tick);
}

/**
 * dt 秒ぶん進める。走行は engine（stepField）。混雑の判定も向こうで入る。
 * engine が FIELD.dt に割って進めるので、1倍・4倍・スキップで結果は変わらない。
 */
function step(dt) {
  stepField(S.cars, dt, {
    course: S.course, load: S.load, totalLaps: S.totalLaps, courseLen: S.courseLen, grid: S.gridStart, clock: S.clock,
  }, HOOKS);
  reactionTick();
  lapTick();
  retireTick();
  constantTick(dt);
  if (S.cars.every((c) => c.finished || c.retired)) finish();
}

function draw() {
  for (const car of S.cars) {
    if (car.retired) { car.dotEl.setAttribute('opacity', .2); continue; }
    const p = pointAt(progress(car, S.courseLen));
    car.dotEl.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})`);
  }
  const me = S.cars[0];
  if (me.plan) highlightSector(Math.min(me.segIdx, me.plan.length - 1));
  const leader = ranked()[0];
  const lapNo = Math.min((S.cars[0].lap ?? 0) + 1, S.totalLaps);
  el('lapNow').textContent = IS_QUALI
    ? (['OUT', 'ATTACK', 'IN'][lapNo - 1] ?? `${lapNo}`)
    : `${Math.min((leader?.lap ?? 0) + 1, S.totalLaps)} / ${S.totalLaps}`;
}

/** 走行位置の順（リタイアは後ろ）。予選はベストラップ順。判定は engine と共通。 */
function ranked() {
  return rankRunners(S.cars, S.courseLen, { quali: IS_QUALI });
}

/** セクタータイム1つ分のセル。まだ走っていなければ「—」。 */
function sectorCell(car, g) {
  const t = car.groupLast[g];
  if (t == null || car.retired) return '<span class="s">—</span>';
  const fixed = t.toFixed(2);
  // 末尾1桁は .opt で包む。狭い画面ではここだけ消えて 1桁の小数になる
  return `<span class="s ${car.groupState[g]}">${fixed.slice(0, -1)}<i class="opt">${fixed.slice(-1)}</i></span>`;
}

/** 1行。POS / CAR / S1 S2 S3 / LAST / GAP（docs/設計/画面設計.md タイミングモニター）。 */
function standingRow(car, i, leader, now) {
  const cls = [car.isPlayer ? 'me' : '', car.retired ? 'out' : '', car.isPlayer ? S.checkeredClass : ''].filter(Boolean).join(' ');
  const short = car.number ? `#${car.number}` : esc(car.short);
  const name = `<span class="nm"><b style="background:${car.color}"></b>`
    + `<span class="full">${esc(car.short)}</span><span class="short">${short}</span></span>`;
  const sectors = [0, 1, 2].map((g) => sectorCell(car, g)).join('');

  if (IS_QUALI) {
    // 予選はベストラップで並ぶ。LAST の列にはそのベストを出す
    const best = Number.isFinite(car.best) ? car.best : null;
    const top = Number.isFinite(leader.best) ? leader.best : null;
    const gap = best == null ? (car.lap === 0 ? 'OUT' : car.lap === 1 ? 'ATK' : '—')
      : car === leader ? 'P1' : `+${(best - top).toFixed(2)}`;
    return `<div class="row ${cls}">
      <span class="pos">${i + 1}</span>${name}${sectors}
      <span class="last">${best != null ? formatTime(best) : '--:--.---'}</span>
      <span class="gap">${gap}</span>
    </div>`;
  }

  let gap;
  if (car.retired) gap = `${car.retiredLap}周 OUT`;
  else if (car === leader) gap = car.finished ? shortTime(car.raceTime) : 'LEADER';
  else if (car.finished && leader.finished) gap = `+${(car.raceTime - leader.raceTime).toFixed(1)}<i class="opt">s</i>`;   // 確定後は総時間差
  else {
    const d = progress(leader, S.courseLen) - progress(car, S.courseLen);
    const lapsDown = Math.floor(d / S.courseLen);
    gap = lapsDown >= 1 ? `+${lapsDown} LAP` : `+${gapSeconds(leader, car).toFixed(1)}<i class="opt">s</i>`;
  }
  const last = lapDisplay(car, now);
  return `<div class="row ${cls}">
    <span class="pos">${car.retired ? '—' : i + 1}</span>${name}${sectors}
    <span class="last">${last != null ? formatTime(last) : '--:--.---'}</span>
    <span class="gap">${gap}</span>
  </div>`;
}

/** 秒 → "m:ss.m"。ギャップ欄のように桁が限られるところで使う。 */
const shortTime = (sec) => `${Math.floor(sec / 60)}:${(sec % 60).toFixed(1).padStart(4, '0')}`;

const HEAD_ROW = '<div class="row head"><span class="pos">P</span><span>CAR</span>'
  + '<span class="s">S1</span><span class="s">S2</span><span class="s">S3</span>'
  + '<span class="last">LAST</span><span class="gap">GAP</span></div>';

/** 常時表示は先頭＋自車の前後3台。全車はスクロールする別枠。 */
function renderStandings() {
  const list = ranked();
  const leader = list[0];
  const now = performance.now();
  const meIdx = list.indexOf(S.cars[0]);
  const from = Math.max(0, meIdx - 3), to = Math.min(list.length, meIdx + 4);
  const rows = [HEAD_ROW];
  if (from > 0) {
    rows.push(standingRow(leader, 0, leader, now));
    if (from > 1) rows.push(`<div class="row gapline">⋯ ${from - 1} 台</div>`);
  }
  for (let i = from; i < to; i++) rows.push(standingRow(list[i], i, leader, now));
  if (to < list.length) rows.push(`<div class="row gapline">⋯ ${list.length - to} 台</div>`);
  el('standings').innerHTML = rows.join('');
  if (!el('standingsFull').hidden) {
    el('standingsFull').innerHTML = list.map((car, i) => standingRow(car, i, leader, now)).join('');
  }
}

el('standingsAll').addEventListener('click', () => {
  const box = el('standingsFull');
  box.hidden = !box.hidden;
  el('standingsAll').classList.toggle('on', !box.hidden);
  renderStandings();
});

/** ゲージの警戒段階。閾値の 90% で琥珀、超えたら赤（docs/設計/画面設計.md）。 */
const TIRE_WARN = 0.6, TIRE_ALARM = 0.8, FUEL_ALARM = 0.15;

/**
 * 警戒段階が変わった瞬間だけ cue を流す。毎フレーム同じイベントを出さないための記録。
 * 段階そのもの（'' / warn / alarm）を返す。
 */
function gaugeState(key, state) {
  if (S.gaugeState[key] !== state) {
    S.gaugeState[key] = state;
    if (!S.skipping) cue(state === 'alarm' ? 'gauge.alarm' : state === 'warn' ? 'gauge.warn' : 'gauge.clear', { gauge: key });
  }
  return state;
}

/** 横棒ゲージ。mark は閾値の位置（0〜1）。 */
const gauge = (ratio, cls = '', mark = null, extra = '') =>
  `<div class="gauge ${extra}"><i class="${cls}" style="width:${clamp(ratio * 100, 0, 100).toFixed(1)}%"></i>`
  + `${mark != null ? `<b style="left:${clamp(mark * 100, 0, 100).toFixed(1)}%"></b>` : ''}</div>`;

/** 車両情報。engine の値をそのまま出す。燃料だけは表示用の見積もり（race.js fuelLevel 参照）。 */
function renderPanel() {
  const me = S.cars[0];
  const stats = me.perf.stats;
  const list = ranked();
  const idx = list.indexOf(me);
  const ahead = list[idx - 1], behind = list[idx + 1];

  const split = tireWearSplit(me.perf, me.tire, me.driver);
  const pct = (w) => Math.min(100, Math.round(w * 100));
  const wearState = (w) => (w >= TIRE_ALARM ? 'alarm' : w >= TIRE_WARN ? 'warn' : '');
  const tireState = gaugeState('tire', wearState(Math.max(split.front, split.rear)));

  const threshold = brakeThreshold(stats);
  const temp = me.brake.temp;
  const tempScale = threshold * 1.4;
  const fade = brakeFadeLoss(stats, me.brake);
  const brakeState = gaugeState('brake', temp > threshold ? 'alarm' : temp >= threshold * RADIO.fadeRatio ? 'warn' : '');

  const fuel = fuelLevel(me.fuel);
  const lapsLeft = fuelLapsLeft(me.fuel, stats);
  const lapsToGo = S.totalLaps - me.lap;
  // 残りが走る周回数を割ったら赤。割合ではなく「足りるかどうか」で警告する
  const fuelState = gaugeState('fuel', lapsLeft < lapsToGo ? 'alarm' : fuel < FUEL_ALARM ? 'warn' : '');

  const secIdx = me.plan ? Math.min(me.segIdx, me.plan.length - 1) : 0;
  const sec = S.course.sectors[secIdx];
  const last = lapDisplay(me);

  // 確定した2台の間は総時間差、走行中は速度差ベース
  const gapTo = (a, b) => (a.finished && b.finished ? b.raceTime - a.raceTime : gapSeconds(a, b));
  const liveA = ahead && !ahead.retired && !me.retired ? gapTo(ahead, me) : null;
  const liveB = behind && !behind.retired && !me.retired ? gapTo(me, behind) : null;
  // 前との差が縮めば緑、開けば琥珀に一瞬光る
  const flash = gapFlash(liveA);
  const gapA = liveA == null ? '—' : `<b>+${liveA.toFixed(1)}s</b> ${esc(ahead.short)}`;
  // 後ろとの差は符号を付けない。「前／後」の並びで向きは分かる
  const gapB = liveB == null ? '—' : `<b>${liveB.toFixed(1)}s</b> ${esc(behind.short)}`;

  el('panel').innerHTML = `
    <div class="cell">
      <div class="k">TIRE WEAR <span class="${tireState}">${pct(me.tire.wear)}%</span></div>
      <div class="tiregauges">
        <span>F</span>${gauge(split.front, wearState(split.front), TIRE_ALARM, 'thin')}
        <span>R</span>${gauge(split.rear, wearState(split.rear), TIRE_ALARM, 'thin')}
      </div>
    </div>
    <div class="cell">
      <div class="k">BRAKE TEMP</div>
      <div class="v"><span class="${brakeState}">${Math.round(temp)}</span><small> / ${Math.round(threshold)}</small></div>
      ${gauge(temp / tempScale, brakeState, threshold / tempScale)}
      <div class="sub jp">${fade > 0 ? `フェード 制動 −${fade.toFixed(1)}` : '&nbsp;'}</div>
    </div>
    <div class="cell">
      <div class="k">FUEL <span class="${fuelState}">${Math.round(fuel * 100)}%</span></div>
      ${gauge(fuel, fuelState || 'ok', FUEL_ALARM)}
      <div class="sub jp">あと <b>${lapsLeft.toFixed(1)}</b> 周ぶん / 残り ${lapsToGo} 周</div>
    </div>
    <div class="cell">
      <div class="k">LAP TIME</div>
      <div class="v big">${last != null ? formatTime(last) : '--:--.---'}</div>
      <div class="sub">BEST ${Number.isFinite(me.best) ? formatTime(me.best) : '—'}</div>
    </div>
    <div class="cell">
      <div class="k">GAP</div>
      <div class="sub jp ${flash}">前 ${gapA}</div>
      <div class="sub jp">後 ${gapB}</div>
    </div>
    <div class="cell">
      <div class="k">SECTOR <span>${secIdx + 1} / ${S.course.sectors.length}</span></div>
      <div class="v jp" style="font-size:13px"><i class="sector-type" style="background:var(--${sec.type.replace('_', '-')})"></i>${SECTOR_LABEL[sec.type]}</div>
      <div class="sub">${sec.length} m · P${idx + 1}</div>
    </div>`;
}

/**
 * 前との差の増減。変わった瞬間から少しの間だけ色のクラスを返す。
 * パネルは作り直されるので、CSS アニメーションではなく時刻で持つ。
 */
const FLASH_MS = 900, FLASH_MIN = 0.15;
function gapFlash(gap) {
  const now = performance.now();
  if (gap != null && S.gapShown != null) {
    const d = gap - S.gapShown;
    if (Math.abs(d) >= FLASH_MIN) {
      S.gapCue = { cls: d < 0 ? 'up' : 'down', at: now };
      if (!S.skipping) cue(d < 0 ? 'gap.shrink' : 'gap.grow', { gap });
    }
  }
  S.gapShown = gap;
  return S.gapCue && now - S.gapCue.at < FLASH_MS ? S.gapCue.cls : '';
}

// ---------------------------------------------------------------------------
// 結果
// ---------------------------------------------------------------------------
function finish() {
  if (S.done) return;
  S.done = true;
  renderPanel();
  flushSkipInfo();     // スキップで溜めた症状を、結末の実況より先に出す
  if (IS_QUALI) { qualiFinish(); return; }
  const list = ranked();
  const vars = baseVars();
  const myPos = list.indexOf(S.cars[0]) + 1;
  // チェッカー：自車の行が光る。勝てば3回、負けても1回（docs/設計/画面設計.md）
  S.checkeredClass = myPos === 1 ? 'win' : 'fin';
  cue('race.checkered', { pos: myPos });
  renderStandings();
  commentary('checkered', 'announcer', { ...vars, pos: myPos }, [myPos === 1 ? 'win' : 'notwin']);
  commentary('checkered', 'analyst', vars);
  renderPanel();

  // --- 収支。賞金は順位別（リタイアは 0）。参加費は決勝で1回。スポンサー料は段階ごとに固定 ------
  const me = S.cars[0];
  const E = S.economy;
  const balance = {
    pos: me.retired ? null : myPos, retired: me.retired,
    prize: prizeFor(E, S.cls, myPos, me.retired), fee: entryFee(E, S.cls), sponsorFee: sponsorFee(E, G.tier),
    best: Number.isFinite(me.best) ? me.best : null,
  };
  balance.net = balance.prize + balance.sponsorFee - balance.fee;
  // 消耗。装着していた所有パーツの耐久が減る。修理はここでは払わない（セッティング画面で任意に）
  const wearResult = applyRaceWear(G, S.mine, S.myPerf.stats.reliability, me.retired, E);
  balance.worn = wearResult.worn;
  balance.repair = wearResult.worn.reduce((sum, w) => {
    const p = S.mine.find((x) => x.id === w.id);
    return sum + repairCost(E, p, w.after, S.cls);
  }, 0);
  G = { ...wearResult.state, money: G.money + balance.net };
  S.balance = balance;
  cue('race.balance', { net: balance.net });

  // シーズン中なら、この戦の結果を記録する（全車の着順 → ポイント、自車の収支、症状の回数）
  const round = G.season ? currentRound(G.season) : null;
  const inSeason = !!round && round.course === S.course.id;
  if (inSeason) {
    const classification = list.map((car, i) => ({ id: car.id, pos: car.retired ? null : i + 1, retired: car.retired }));
    G = recordResult(G, {
      classification,
      mine: { pos: balance.pos, retired: balance.retired, prize: balance.prize, fee: balance.fee, sponsorFee: balance.sponsorFee, repair: balance.repair, best: balance.best },
      symptoms: S.symptoms,
    }, E);
  }
  save(G);   // 収支と消耗を反映し終えた。ここが1戦の区切り
  const nextHref = inSeason
    ? `season.html${searchWithState(G, {})}`
    : `setup.html${searchWithState(G, { course: S.course.id, laps: S.totalLaps })}`;
  el('backLink').href = nextHref;
  el('backLink').textContent = inSeason ? 'シーズンへ' : 'セッティングへ戻る';

  const yen = (n) => `${n < 0 ? '−' : ''}¥${Math.abs(Math.round(n)).toLocaleString('ja-JP')}`;
  const line = (k, v, cls = '') => `<div class="brow ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  el('resultWrap').innerHTML = `<div class="result"><h3 class="cap">収支</h3>
    <div class="balance">
      ${line('賞金', yen(balance.prize) + (me.retired ? '（リタイア）' : `（${myPos}位）`))}
      ${balance.sponsorFee ? line('スポンサー料', yen(balance.sponsorFee)) : ''}
      ${line('参加費', yen(-balance.fee))}
      ${line('差し引き', yen(balance.net), balance.net >= 0 ? 'up' : 'down')}
      ${line('所持金', yen(G.money), 'total')}
      ${balance.worn.length ? line('消耗', balance.worn.map((w) => {
        const p = S.mine.find((x) => x.id === w.id);
        return `<span class="wear${w.after <= 0 ? ' broken' : ''}">${esc(p.name)} ${Math.round(w.before)}→${Math.round(w.after)}</span>`;
      }).join('<br>'), 'wear') : ''}
      ${balance.repair ? line('修理の見積もり', `${yen(-balance.repair)}<small>（払うかどうかはセッティング画面で）</small>`, 'down') : ''}
    </div>
    <div class="controls" style="padding:8px"><a class="btn primary" href="${nextHref}">${inSeason ? 'シーズンへ（結果を反映）' : 'セッティングへ（収支を反映）'}</a></div>
  </div>` + `<div class="result"><h3 class="cap">結果</h3>${list.map((car, i) => {
    const wear = (car.lastWear * 100).toFixed(0);
    return `<div class="rrow ${car.isPlayer ? 'me' : ''}">
      <span class="pos">${car.retired ? '—' : i + 1}</span>
      <span>${car.name}
        <div class="sub">${car.retired
          ? `${car.retiredLap}周目にリタイア${car.retireReason === 'fuel' ? '（燃料切れ）' : ''}`
          : `最終周 タイヤ摩耗 ${wear}% / ブレーキ温度 ${Math.round(car.lastTemp)}`
            + `${car.lastFade > 0 ? `（フェード −${car.lastFade.toFixed(1)}）` : ''}`}</div>
      </span>
      <span class="t"><b>${car.retired ? 'DNF' : formatTime(car.raceTime)}</b>
        <div class="sub">ベスト ${Number.isFinite(car.best) ? formatTime(car.best) : '—'}</div>
      </span>
    </div>`;
  }).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// 操作
// ---------------------------------------------------------------------------
function setSpeed(v) {
  S.speed = v;
  el('btn1').classList.toggle('on', v === 1);
  el('btn4').classList.toggle('on', v === 4);
}
el('btn1').addEventListener('click', () => { S.paused = false; setSpeed(1); syncPause(); });
el('btn4').addEventListener('click', () => { S.paused = false; setSpeed(4); syncPause(); });
el('btnSkip').addEventListener('click', () => {
  if (S.done) return;
  // 決着まで一気に進める。残すのは症状（情報系）と結末の実況だけ。
  // 症状は同じトリガーを1本にまとめてから、決着の直前にまとめて出す。
  S.skipping = true;
  S.skipInfo.clear();
  let guard = 0;
  while (!S.done && guard++ < 200000) step(2);
  S.skipping = false;
  renderStandings();
  renderPanel();
  renderLog();
  draw();
});
function syncPause() {
  el('btnPause').textContent = S.paused ? '再開' : '一時停止';
  el('btnPause').classList.toggle('on', S.paused);
}
el('btnPause').addEventListener('click', () => { S.paused = !S.paused; syncPause(); });

boot().catch((err) => {
  document.body.insertAdjacentHTML('afterbegin',
    `<div class="err">読み込みに失敗しました：${err.message}<br>
     このページは JSON を読み込むため、<b>HTTP 経由で開く必要があります</b>（file:// では動きません）。</div>`);
  console.error(err);
});
</script>
</body>
</html>
