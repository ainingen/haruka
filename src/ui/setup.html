<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>セッティング — ハルカのセッティングノート</title>
<style>
/* ===========================================================================
   図面様式のセッティング画面（docs/設計/画面設計.md）
   色はすべて CSS 変数。テーマ差し替えはここだけを書き換える。
   =========================================================================== */
:root {
  --paper:      #f2efe6;  /* 図面紙 */
  --paper-2:    #e9e5d9;  /* 枠内の淡い地 */
  --ink:        #23211c;  /* 主線・本文 */
  --ink-2:      #6b665c;  /* 補助線・注記 */
  --ink-3:      #9a9488;  /* 未装着・無効 */
  --rule:       #3a372f;  /* 図面枠 */
  --car:        #c0392b;  /* 自車＝赤 */
  --ai:         #1b4f9c;  /* AI車＝青（凡例のみ） */
  --dim:        #7a7468;  /* 寸法線 */
  --accent:     #8a6d1f;  /* 見出しの下線・強調 */
  --good:       #2f6b3a;  /* 効果 */
  --bad:        #9c3b2e;  /* 副作用 */
  --lock-bg:    #e2ded1;
  --field:      #fbf9f3;
  --shadow:     rgba(0,0,0,.08);
  --jp-font:    "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --hand-font:  "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;

  /* --- 画面の層（モニター）。ライト／ダークに関わらず黒地（docs/設計/画面設計.md） --- */
  --mon-bg:     #0a0d11;
  --mon-bg-2:   #151b23;
  --mon-line:   #2a333d;
  --mon-text:   #e8edf2;
  --mon-dim:    #7d8894;
  --mon-green:  #3ddc84;
  --mon-amber:  #ffb347;
  --mon-red:    #ff4d4d;
  --mon-purple: #c77dff;
  --mon-car:    #ff5a4a;
  --mon-ai:     #4da3ff;
  --mon-font:   ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:   #14171c;  /* 青焼き風 */
    --paper-2: #1a1e25;
    --ink:     #d6dde6;
    --ink-2:   #8b96a4;
    --ink-3:   #5d6673;
    --rule:    #7f8b9a;
    --car:     #e8604f;
    --ai:      #6aa6ff;
    --dim:     #7f8b9a;
    --accent:  #d2b357;
    --good:    #74c98a;
    --bad:     #e08878;
    --lock-bg: #1f242c;
    --field:   #11141a;
    --shadow:  rgba(0,0,0,.4);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 13px/1.6 "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding: 8px;
  padding-bottom: 104px;           /* 固定フッターぶん（ボタン3つが2段に折り返しても隠れない） */
}

/* --- 図面枠：外枠と内枠の二重線 ----------------------------------------- */
.sheet {
  max-width: 720px; margin: 0 auto;
  border: 2px solid var(--rule);
  padding: 4px;
  background: var(--paper);
}
.sheet-inner {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 10px;
}

/* --- タイトルブロック ---------------------------------------------------- */
.titleblock {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 8px;
}
.projectbar .k { font-size: 10px; letter-spacing: .12em; color: var(--ink-2); }
.projectbar .driver { font-size: 17px; font-weight: 700; letter-spacing: .04em; }
.projectbar .cls { font-size: 11px; color: var(--ink-2); }
.sheetno {
  text-align: right; font-size: 10px; color: var(--ink-2);
  border: 1px solid var(--ink-3); padding: 3px 6px; line-height: 1.4; white-space: nowrap;
}
.sheetno b { display: block; font-size: 13px; color: var(--ink); letter-spacing: .08em; }

/* --- セクション見出し ---------------------------------------------------- */
h2 {
  font-size: 10px; letter-spacing: .2em; color: var(--ink-2);
  margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--ink-3);
  font-weight: 600;
}

/* --- デバッグ切替 -------------------------------------------------------- */
.tabs { display: flex; gap: 0; margin-top: 8px; border-bottom: 1px solid var(--rule); }
.tabs button {
  font: inherit; font-size: 12px; letter-spacing: .1em; padding: 6px 16px; cursor: pointer;
  background: var(--lock-bg); color: var(--ink-2); border: 1px solid var(--ink-3); border-bottom: 0; margin-bottom: -1px;
}
.tabs button.on { background: var(--paper-2); color: var(--ink); border-color: var(--rule); font-weight: 700; }
.tabs .hint { margin-left: auto; font-size: 10px; color: var(--ink-2); align-self: center; }
.calcbar a.ghost { pointer-events: auto; font: inherit; font-size: 12px; padding: 10px 12px; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 2px 6px var(--shadow); }

.debug {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  background: var(--lock-bg); border: 1px dashed var(--ink-3);
  padding: 6px 8px; margin-top: 8px; font-size: 11px;
}
.debug .tag { font-size: 9px; letter-spacing: .14em; color: var(--ink-2); }
.debug label { display: flex; align-items: center; gap: 5px; }
.debug select {
  font: inherit; font-size: 11px; padding: 2px 4px;
  background: var(--field); color: var(--ink); border: 1px solid var(--ink-3);
}

/* --- 主ビュー ------------------------------------------------------------ */
.mainview { width: 100%; height: auto; display: block; margin-top: 6px; }
/* fill は各要素の属性で指定する（ここで指定すると装着済みバルーンの番号が潰れる） */
.mainview text { font-family: inherit; }
.note-scale { font-size: 10px; color: var(--ink-2); text-align: right; margin-top: -2px; }

/* --- DETAIL 枠 ----------------------------------------------------------- */
.details { display: flex; gap: 8px; margin-top: 10px; }
.detail { flex: 1 1 0; border: 1px solid var(--rule); background: var(--field); padding: 4px; min-width: 0; }
.detail .cap {
  font-size: 9px; letter-spacing: .14em; color: var(--ink-2);
  border-bottom: 1px solid var(--ink-3); padding-bottom: 2px; margin-bottom: 2px;
}
.detail svg { width: 100%; max-width: 168px; height: auto; display: block; margin: 0 auto; }
.detail .sub { font-size: 10px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }

/* --- スライダー ---------------------------------------------------------- */
.slider { margin: 10px 0; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.slider .val { font-variant-numeric: tabular-nums; font-weight: 700; }
.slider input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--car); }
.slider .hint { font-size: 10px; color: var(--ink-2); }
.slider .locked { color: var(--ink-3); font-size: 10px; }

/* --- 部品表：カテゴリ見出し＋スロット行 ---------------------------------- */
.bom { border: 1px solid var(--rule); }
.bom-cat {
  display: flex; align-items: center; gap: 7px;
  background: var(--lock-bg); border-bottom: 1px solid var(--ink-3);
  padding: 5px 8px; font-size: 11px; letter-spacing: .1em;
}
.bom-cat .no {
  width: 19px; height: 19px; border: 1px solid var(--ink); border-radius: 50%;
  display: grid; place-items: center; font-size: 10px; font-variant-numeric: tabular-nums;
  letter-spacing: 0; flex: none;
}
.bom-cat .fill { margin-left: auto; font-size: 10px; color: var(--ink-2); letter-spacing: 0; }
.bom-row {
  display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; align-items: center;
  padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--ink-3);
  background: none; width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: inherit;
}
.bom-row:last-child { border-bottom: 0; }
.bom-row:hover { background: var(--field); }
.bom-row .slot { font-size: 10px; letter-spacing: .06em; color: var(--ink-2); }
.bom-row .name { font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.bom-row .name.empty {
  color: var(--ink-3); border: 1px dashed var(--ink-3);
  padding: 1px 8px; display: inline-block; font-size: 11.5px;
}
.bom-row .name.included { color: var(--ink-3); font-size: 11.5px; }
.bom-row .chev { font-size: 10px; color: var(--ink-2); white-space: nowrap; }
.badge {
  font-size: 9px; letter-spacing: .08em; border: 1px solid var(--bad); color: var(--bad);
  padding: 0 4px; margin-left: 6px; white-space: nowrap;
}
.badge.unit { border-color: var(--accent); color: var(--accent); }

/* --- パーツ選択モニター（画面の層）。紙の図面の上に黒いモーダルで開く ----------
   docs/設計/画面設計.md「setup.html — パーツ選択モニター」。
   左：候補リスト、右：現在 → 装着後の比較（レーダー6軸）、下：大河の note（紙）、フッター：装着。 */
.monitor {
  background: var(--mon-bg); color: var(--mon-text);
  font-family: var(--mon-font); font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums;
}
.monitor .jp { font-family: var(--jp-font); }
.modal-back {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
  display: grid; place-items: center; padding: 12px;
}
.modal-back[hidden] { display: none; }
.modal {
  width: min(720px, 100%); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
  border: 1px solid var(--mon-line); box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.6);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
}
.mod-head { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--mon-line); }
.mod-head .k { font-size: 10px; letter-spacing: .2em; color: var(--mon-green); white-space: nowrap; }
.mod-head .t { font-family: var(--jp-font); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod-head .x {
  margin-left: auto; font: inherit; font-size: 13px; line-height: 1; padding: 4px 8px; cursor: pointer;
  background: none; border: 1px solid var(--mon-line); color: var(--mon-text);
}
.mod-head .x:hover { border-color: var(--mon-text); }
.mod-body { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 0; }
.mod-list { overflow-y: auto; border-right: 1px solid var(--mon-line); min-height: 0; }
.cand {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 6px; align-items: baseline;
  width: 100%; padding: 6px 8px; border: 0; border-bottom: 1px solid var(--mon-line);
  background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.cand:hover { background: var(--mon-bg-2); }
.cand.sel { background: var(--mon-bg-2); box-shadow: inset 2px 0 0 var(--mon-green); }
.cand .mk { color: var(--mon-green); font-size: 10px; }
.cand .nm { font-family: var(--jp-font); font-size: 12px; overflow-wrap: anywhere; }
.cand .pr { color: var(--mon-dim); font-size: 11px; white-space: nowrap; }
.cand .why { grid-column: 2 / -1; font-family: var(--jp-font); font-size: 10px; color: var(--mon-amber); }
.cand.locked .nm { color: var(--mon-dim); }
.cand.locked .mk { color: var(--mon-amber); }
.mod-cmp { overflow-y: auto; padding: 8px 10px 10px; min-height: 0; }
.cmp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; border-bottom: 1px solid var(--mon-line); padding-bottom: 5px; }
.cmp-head .nm { font-family: var(--jp-font); font-size: 13px; font-weight: 700; }
.cmp-head .meta { color: var(--mon-dim); font-size: 11px; }
.cmp-head .unit { flex-basis: 100%; font-family: var(--jp-font); font-size: 10px; color: var(--mon-amber); }
.cmp-cap { font-size: 9px; letter-spacing: .2em; color: var(--mon-dim); margin: 8px 0 2px; }
.radar { width: 100%; max-width: 230px; height: auto; display: block; margin: 2px auto 0; }
.radar .axis-label { font-family: var(--jp-font); font-size: 9.5px; fill: var(--mon-dim); }
.axes { width: 100%; border-collapse: collapse; font-size: 12px; }
.axes th { font-size: 9px; letter-spacing: .14em; color: var(--mon-dim); font-weight: 400; text-align: right; padding: 0 4px 2px; }
.axes th:first-child { text-align: left; }
.axes td { padding: 2px 4px; border-top: 1px dashed var(--mon-line); text-align: right; white-space: nowrap; }
.axes td.lb { font-family: var(--jp-font); color: var(--mon-dim); text-align: left; }
.axes td.arrow { color: var(--mon-dim); padding: 0; }
.axes td.after { color: var(--mon-green); }
.axes td.d.up { color: var(--mon-green); }
.axes td.d.dn { color: var(--mon-amber); }
.axes td.d.eq { color: var(--mon-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; font-family: var(--jp-font); }
.chips .e { color: var(--mon-green); }
.chips .s { color: var(--mon-amber); }
.chips .none { color: var(--mon-dim); }
.rolling { color: var(--mon-green); }
.mod-note {
  position: relative; background: var(--paper); color: var(--ink); border-top: 1px solid var(--mon-line);
  padding: 6px 10px 7px 16px; font-family: var(--hand-font); font-size: 12.5px; line-height: 1.7; letter-spacing: .03em;
}
.mod-note::before { content: ''; position: absolute; left: 7px; top: 7px; bottom: 7px; width: 2px; background: var(--accent); }
.mod-note .k { display: block; font-family: var(--jp-font); font-size: 8.5px; letter-spacing: .2em; color: var(--ink-2); }
.mod-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 7px 10px; border-top: 1px solid var(--mon-line); }
.mod-foot .msg { flex: 1 1 160px; font-family: var(--jp-font); font-size: 10.5px; color: var(--mon-amber); min-width: 0; }
.mod-foot .msg.ok { color: var(--mon-dim); }
.mod-foot button {
  font: inherit; font-size: 12px; padding: 6px 14px; cursor: pointer; letter-spacing: .06em; white-space: nowrap;
  background: none; border: 1px solid var(--mon-line); color: var(--mon-text);
}
.mod-foot button:hover { border-color: var(--mon-text); }
.mod-foot button.primary { border-color: var(--mon-green); color: var(--mon-green); font-weight: 700; }
.mod-foot button.primary:hover { background: var(--mon-green); color: var(--mon-bg); }
.mod-foot button[disabled] { color: var(--mon-dim); border-color: var(--mon-line); cursor: not-allowed; background: none; }
@media (max-width: 560px) {
  .modal-back { padding: 6px; }
  .modal { max-height: calc(100vh - 12px); max-height: calc(100dvh - 12px); }
  .mod-body { display: block; overflow-y: auto; }
  .mod-list { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--mon-line); }
}

/* --- 下段ステータス ------------------------------------------------------ */
.status {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--ink-3); border: 1px solid var(--rule); margin-top: 12px;
}
.status div { background: var(--paper-2); padding: 6px 8px; }
.status .k { font-size: 9px; letter-spacing: .14em; color: var(--ink-2); }
.status .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.status .u { font-size: 10px; font-weight: 400; color: var(--ink-2); }
.status .sub { font-size: 10px; color: var(--ink-2); }
.status .rolling { color: var(--good); }
.warn {
  margin-top: 8px; border: 1px solid var(--bad); color: var(--bad);
  padding: 5px 8px; font-size: 11px;
}

/* --- ラップ計算 ---------------------------------------------------------- */
/* --- ピットでの一言（docs/設計/無線.md）。無線とは別枠で、画面の隅に置く ---- */
.pitline {
  display: flex; align-items: baseline; gap: 8px; margin-top: 12px;
  border: 1px solid var(--rule); border-left: 3px solid var(--car); background: var(--field);
  padding: 5px 9px; font-size: 12px; line-height: 1.45; min-height: 30px;
}
.pitline[hidden] { display: none; }
.pitline .k { font-size: 8.5px; letter-spacing: .2em; color: var(--ink-2); white-space: nowrap; flex: none; }
.pitline span:last-child { color: var(--car); }

.calcbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 8px;
  background: linear-gradient(to top, var(--paper) 60%, transparent);
  pointer-events: none;
}
.calcbar button {
  pointer-events: auto; font: inherit; font-size: 12.5px; font-weight: 700;
  padding: 9px 14px; cursor: pointer; letter-spacing: .06em;
  background: var(--car); color: #fff; border: 1px solid var(--rule);
  box-shadow: 0 2px 6px var(--shadow);
}
.calcbar button.ghost { background: var(--paper); color: var(--ink); font-weight: 400; }

/* --- 出走設定 ------------------------------------------------------------- */
.entry { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; }
.entry label { display: flex; align-items: center; gap: 5px; }
.entry select {
  font: inherit; font-size: 12px; padding: 3px 5px;
  background: var(--field); color: var(--ink); border: 1px solid var(--ink-3);
}
.entry .note { font-size: 10px; color: var(--ink-2); flex-basis: 100%; }
.notes { margin-top: 10px; border: 1px solid var(--rule); background: var(--field); }
.notes .cap { font-size: 9px; letter-spacing: .2em; color: var(--ink-2); padding: 4px 8px; border-bottom: 1px solid var(--ink-3); background: var(--lock-bg); }
.notes .body { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; }
.notes .hand { margin: 0; flex: 1 1 200px; font-size: 13px; line-height: 1.6; color: var(--ink);
  font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif; letter-spacing: .04em; }
.notes .hand.blank { color: var(--ink-3); font-family: inherit; font-size: 11px; }
.notes button { font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); }
.notes button:disabled { color: var(--ink-3); cursor: default; }
.laps { margin-top: 10px; border: 1px solid var(--rule); }
.laps .lap {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline;
  padding: 6px 8px; border-bottom: 1px solid var(--ink-3); font-size: 12px;
}
.laps .lap:last-child { border-bottom: 0; }
.laps .cname { min-width: 0; }
.laps .cprof { font-size: 10px; color: var(--ink-2); }
.laps .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
.laps .d { font-size: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }

.legend { font-size: 10px; color: var(--ink-2); margin-top: 8px; display: flex; gap: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.err { border: 1px solid var(--bad); color: var(--bad); padding: 10px; font-size: 12px; }

@media (max-width: 400px) {
  body { padding: 4px; }
  .sheet-inner { padding: 7px; }
  .details { flex-direction: column; }
  .status { grid-template-columns: 1fr 1fr; }
  .status div:last-child { grid-column: 1 / -1; }
  .bom-row { grid-template-columns: 68px 1fr auto; padding-left: 8px; }
}
</style>
</head>
<body>

<div class="sheet"><div class="sheet-inner">

  <div class="titleblock">
    <div class="projectbar">
      <div class="k">DRIVER</div>
      <div class="driver" id="driverName">—</div>
      <div class="cls" id="classLine">—</div>
    </div>
    <div class="sheetno">
      <span>SHEET</span>
      <b id="sheetNo">—</b>
      <span id="chassisName">—</span>
    </div>
  </div>

  <div class="debug">
    <span class="tag">DEBUG</span>
    <label>クラス
      <select id="selClass">
        <option value="1">1 走行会</option>
        <option value="2" selected>2 地方選手権</option>
        <option value="3">3 全国耐久</option>
        <option value="4">4 上位GT</option>
        <option value="5">5 トップ</option>
      </select>
    </label>
    <label>スポンサー
      <select id="selTier">
        <option value="0">0 なし</option>
        <option value="1" selected>1 地元</option>
        <option value="2">2 地方チェーン</option>
        <option value="3">3 全国企業</option>
        <option value="4">4 大手メーカー</option>
      </select>
    </label>
  </div>

  <div class="tabs">
    <button type="button" data-session="quali" id="tabQuali">予選</button>
    <button type="button" data-session="race" id="tabRace" class="on">決勝</button>
    <span class="hint" id="tabHint">予選と決勝で別のセッティングを持てます</span>
  </div>

  <h2>主ビュー / 側面</h2>
  <svg class="mainview" id="mainview" viewBox="0 0 412 188" role="img" aria-label="車体側面図と寸法"></svg>
  <div class="note-scale" id="scaleNote"></div>

  <div class="details">
    <div class="detail">
      <div class="cap">DETAIL A — ホイール</div>

<script type="module">
import {

  SETTINGS, isSettingUnlocked, SLOTS, occupiedSlots, pitComment, simulateQualifying,
} from '../engine/race.js';

// ---------------------------------------------------------------------------
// 表示用の語彙（data/README.md のキー → 日本語）
// ---------------------------------------------------------------------------
const STAT_LABEL = {
  power: '出力', top_end_power: '高回転の伸び', low_end_torque: '低速トルク',
  throttle_response: 'レスポンス', acceleration: '加速', top_speed: '最高速',

const SLOT_LABEL = {

  final: 'ファイナル', clutch: 'クラッチ', lsd: 'LSD', gearbox: 'ミッション',

};
const CATEGORIES = [
  { id: 'engine',      label: 'エンジン' },
  { id: 'drivetrain',  label: '駆動系' },
  { id: 'suspension',  label: '足回り' },
  { id: 'tire',        label: 'タイヤ' },
  { id: 'brake',       label: 'ブレーキ' },
  { id: 'aero_weight', label: '軽量化・空力' },
];
/** クラス → 車体。docs/設計/クラス構成.md の車両欄に対応（3 はセダンを使う）。 */
const CLASS_CHASSIS = { 1: 'hatchback', 2: 'sedan', 3: 'sedan', 4: 'gt', 5: 'formula' };
const CLASS_LABEL = { 1: '走行会・草レース', 2: '地方選手権', 3: '全国耐久', 4: '上位GT', 5: 'トップカテゴリー' };
const TIER_LABEL = ['なし（自腹）', '地元スポンサー', '地方チェーン', '全国企業', '大手メーカー'];
const PROFILE_LABEL = {
  straight: 'ストレート主体', corner: 'コーナー主体', balanced: 'バランス型',
  fast: '高速コーナー主体', stopgo: 'ストップ＆ゴー',
};
/** ポイント → 表示単位の換算（data/README.md：換算は表示側で行う） */
const KG_PER_POINT = 2;
const PS_PER_POINT = 2.5;
/** 車高の図示だけを誇張する倍率。寸法の数値は実寸のまま。 */
const RIDE_EXAGGERATION = 4;

const SVG_NS = 'http://www.w3.org/2000/svg';
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------------------------------------------------------------------
// 演出のイベント（docs/設計/画面設計.md「演出のイベント名」）
// 音は入れない。点滅や数字回転はすべてここを通し、後で音を同期できるようにしておく。
// ---------------------------------------------------------------------------
function cue(name, detail = {}) {
  document.dispatchEvent(new CustomEvent('cue', { detail: { name, ...detail } }));
}

/**
 * 数字を旧値から新値へ回して止める。fmt は数値 → 表示文字列。
 * 旧値が無い（初回）か同じなら回さずに置く。
 */
function rollNumber(node, from, to, fmt, ms = 650) {
  if (!Number.isFinite(from) || from === to) { node.textContent = fmt(to); return; }
  cue('number.roll', { from, to });
  node.classList.add('rolling');
  node.textContent = fmt(from);               // 最初のフレームまで新値が見えないように
  const t0 = performance.now();
  const frame = (now) => {
    const t = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - t, 3);          // 最初は速く、最後にゆっくり止まる
    node.textContent = fmt(from + (to - from) * e);
    if (t < 1) requestAnimationFrame(frame);
    else { node.classList.remove('rolling'); cue('number.settle', { to }); }
  };
  requestAnimationFrame(frame);
}

/**
 * レーダーチャートの6軸（表示専用。計算には使わない）。
 * 26 の性能キーをここで畳む。重みは「その軸の印象にどれだけ寄与するか」で、data/README.md の
 * 有利・不利の向きに合わせて符号を付けてある（weight は増えると不利なので負）。
 */
const RADAR_AXES = [
  { id: 'power',   label: '出力',     w: { power: 1, top_end_power: .5, low_end_torque: .5, throttle_response: .3, acceleration: .5, top_speed: .5 } },
  { id: 'grip',    label: 'グリップ', w: { cornering_grip: 1, downforce: .6, traction: .5, road_compliance: .4, turn_in: .3 } },
  { id: 'brake',   label: 'ブレーキ', w: { braking: 1, fade_resistance: .6 } },
  { id: 'stable',  label: '安定',     w: { stability: 1, rigidity: .6 }, balanceDev: -1 },
  { id: 'light',   label: '軽さ',     w: { weight: -1, unsprung_weight: -2, drag: -.5 } },
  { id: 'durable', label: '耐久',     w: { reliability: 1, heat: -.7, tire_wear: -.5, driver_demand: -.3 } },
];
/** 目盛の下限（クラス別）。パーツのポイントはクラス1で ±1〜6、クラス5で ±10〜40。 */
const RADAR_FLOOR = { 1: 8, 2: 12, 3: 18, 4: 26, 5: 36 };

/** perf → 6軸の値。stable だけ好みからのバランスのズレを引く。 */
function radarValues(p) {
  return RADAR_AXES.map((ax) => {
    let v = 0;
    for (const [k, w] of Object.entries(ax.w)) v += w * (p.stats[k] ?? 0);
    if (ax.balanceDev) v += ax.balanceDev * p.balanceDev;
    return v;
  });
}
const svgEl = (name, attrs = {}, text = null) => {
  const n = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== null) n.textContent = text;
  return n;
};
const ALL_SLOTS = CATEGORIES.flatMap((c) => SLOTS[c.id]);
const slotCategory = (slot) => CATEGORIES.find((c) => SLOTS[c.id].includes(slot)).id;

// ---------------------------------------------------------------------------
// 状態：装着はスロット単位で持つ（ユニット部品は複数スロットに同じ id が入る）
// ---------------------------------------------------------------------------
const state = {
  cls: 2,
  tier: 1,
  equipped: Object.fromEntries(ALL_SLOTS.map((s) => [s, null])),  // slot -> part id
  settings: {},        // key -> 値（未設定なら既定値）
  openSlot: null,      // パーツ選択モニターを開いているスロット
  candidate: null,     // モニターで選択中の候補（パーツ id）
  /** いま編集しているセッション。予選と決勝で装着と連続値を別に持つ */
  session: 'race',
  /** 表示していない側のセッションの { equipped, settings }。null なら未作成 */
  stash: { quali: null, race: null },
};

/** 予選用セッティングの初期値：決勝用の写し＋空気圧を高め（一発なら高くていい） */
const QUALI_PRESSURE_BUMP = 0.3;

function snapshotSetup() {
  return { equipped: { ...state.equipped }, settings: { ...state.settings } };
}
function loadSetup(setup) {
  state.equipped = { ...setup.equipped };
  state.settings = { ...setup.settings };
}
function switchSession(to) {
  if (to === state.session) return;
  state.stash[state.session] = snapshotSetup();
  let next = state.stash[to];
  if (!next) {
    next = snapshotSetup();
    if (to === 'quali') {
      const cur = next.settings.tire_pressure ?? SETTINGS.tire_pressure.defaultValue();
      next.settings.tire_pressure = Math.min(2.6, Math.round((cur + QUALI_PRESSURE_BUMP) * 20) / 20);
    }
  }
  loadSetup(next);
  state.session = to;
  closePicker();
  el('tabQuali').classList.toggle('on', to === 'quali');
  el('tabRace').classList.toggle('on', to === 'race');
  pitShown = null;
  renderAll();
  clearLaps(true);
}
let DATA = null;

const chassis = () => DATA.chassis[CLASS_CHASSIS[state.cls]];
const partById = (id) => DATA.parts.find((p) => p.id === id) ?? null;
/** 装着中のパーツ（重複を除く）。ユニット部品は1点として数える。 */
const equippedParts = () =>
  [...new Set(Object.values(state.equipped).filter(Boolean))].map(partById);
/** 規定とスポンサー段階を満たしているか。 */
const isLegal = (p) => p.class_required <= state.cls && p.sponsor_tier <= state.tier;
/** 性能計算に乗るのは「装着済み かつ 規定を満たす」パーツだけ。 */
const activeParts = () => equippedParts().filter(isLegal);
const illegalParts = () => equippedParts().filter((p) => !isLegal(p));
/** そのスロットを塞いでいるユニット部品（ホームスロットでない場合だけ返す）。 */
function coveredBy(slot) {
  const id = state.equipped[slot];
  if (!id) return null;
  const p = partById(id);
  return p.slot === slot ? null : p;
}
/** そのスロットに入っている「規定を満たす」パーツ。DETAIL の描き分けに使う。 */
function inSlot(slot) {
  const id = state.equipped[slot];
  if (!id) return null;
  const p = partById(id);
  return isLegal(p) ? p : null;
}

/** part を装着したときの装着表（state は変えない）。取り合いになる既存パーツは占有スロットごと外れる。 */
function equippedWith(part, base = state.equipped) {
  const eq = { ...base };
  const slots = occupiedSlots(part);
  for (const id of new Set(Object.values(eq).filter(Boolean))) {
    const cur = partById(id);
    if (occupiedSlots(cur).some((s) => slots.includes(s))) {
      for (const s of occupiedSlots(cur)) eq[s] = null;
    }
  }
  for (const s of slots) eq[s] = part.id;
  return eq;
}
function equipPart(part) {
  state.equipped = equippedWith(part);
}
function unequipSlot(slot) {
  const id = state.equipped[slot];
  if (!id) return;
  for (const s of occupiedSlots(partById(id))) state.equipped[s] = null;
}

function settingValue(key) {
  return state.settings[key] ?? SETTINGS[key].defaultValue(chassis());
}
/** 解禁されているセッティングだけを race.js に渡す。 */
function activeSettingsOf(parts) {
  const out = {};
  for (const [key, def] of Object.entries(SETTINGS)) {
    if (isSettingUnlocked(def, parts)) out[key] = settingValue(key);
  }
  return out;
}
const activeSettings = () => activeSettingsOf(activeParts());
/** 装着表 → race.js に渡すスロット → パーツ の対応表（重複は race.js が検査する）。規定外は落とす。 */
function loadoutOf(equipped) {
  const map = {};
  for (const [slot, id] of Object.entries(equipped)) {
    if (!id) continue;
    const p = partById(id);
    if (isLegal(p) && p.slot === slot) map[slot] = p;   // ホームスロットの分だけ入れる
  }
  return map;
}
const loadout = () => loadoutOf(state.equipped);
/** 任意の装着表で性能を組む。モニターの「装着後」はこれで作る（state は変えない）。 */
function perfOf(equipped) {
  const lo = loadoutOf(equipped);
  return buildPerformance(lo, DATA.driver, chassis(), activeSettingsOf(Object.values(lo)));
}
const perf = () => perfOf(state.equipped);

// ---------------------------------------------------------------------------
// データ読み込み
// ---------------------------------------------------------------------------
const json = (path) => fetch(new URL(path, import.meta.url)).then((r) => {
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
});

async function loadCarSvg(id) {
  const res = await fetch(new URL(`../../assets/svg/car-${id}.svg`, import.meta.url));
  if (!res.ok) throw new Error(`car-${id}.svg: ${res.status}`);
  const doc = new DOMParser().parseFromString(await res.text(), 'image/svg+xml');
  const root = doc.documentElement;
  const [, , vbW, vbH] = root.getAttribute('viewBox').split(/\s+/).map(Number);
  // 描画要素だけを取り出す（metadata と title は捨てる）
  const groups = [...root.querySelectorAll('g')].map((g) => g.cloneNode(true));
  return { vbW, vbH, groups };
}

async function loadAll() {
  const [parts, chassisData, courses, drivers, radio, notes] = await Promise.all([
    json('../../data/parts.json'),
    json('../../data/chassis.json'),
    json('../../data/courses.json'),
    json('../../data/drivers.json'),
    json('../../data/radio.json'),
    json('../../data/notes.json'),
  ]);
  const cars = {};
  for (const id of ['hatchback', 'sedan', 'gt', 'formula']) cars[id] = await loadCarSvg(id);
  return { parts, chassis: chassisData, courses, drivers, driver: drivers[0], radio, notes, cars };
}

// ---------------------------------------------------------------------------
// 主ビュー：車体 + 寸法線 + 引き出し（バルーン）
// ---------------------------------------------------------------------------

/** パスの y 座標をまとめてずらす。車高を下げるとボディだけが沈み、ホイールは残る。 */
function shiftPathY(d, dy) {
  return d.replace(/([MLCSQTA])\s*(-?[\d.]+)\s+(-?[\d.]+)/g,
    (_, cmd, x, y) => `${cmd}${x} ${(Number(y) + dy).toFixed(2)}`);
}

/** 引き出しの取り付け点（車体 bbox に対する比率）。車種が変わっても破綻しない。 */
const ANCHORS = {
  engine:      [0.20, 0.42],
  suspension:  [0.30, 0.66],
  brake:       [0.24, 0.90],
  aero_weight: [0.88, 0.20],
  drivetrain:  [0.56, 0.74],
  tire:        [0.76, 0.94],
};
/** 左列・右列それぞれ上から順に並べるカテゴリ。 */
const BALLOON_COLUMNS = {
  left:  ['engine', 'suspension', 'brake'],
  right: ['aero_weight', 'drivetrain', 'tire'],
};
const DIM = { stroke: 'var(--dim)', 'stroke-width': .7, fill: 'none' };

function drawMainView() {
  const view = el('mainview');
  view.textContent = '';
  const car = DATA.cars[chassis().id];
  const disp = chassis().display;

  // --- 車体 ---------------------------------------------------------------
  const scale = 232 / car.vbW;
  const originX = (392 - car.vbW * scale) / 2;
  const originY = 16;
  const g = svgEl('g', {
    transform: `translate(${originX} ${originY}) scale(${scale})`,
    color: 'var(--car)',
  });
  // 車高：基準からの下げ幅ぶんボディだけを沈める（ホイールは残る＝図示のみ誇張）
  const rideDelta = disp.ride_height_mm - settingValue('ride_height');
  const mmPerUnit = disp.length_mm / car.vbW;
  const dy = (rideDelta / mmPerUnit) * RIDE_EXAGGERATION;
  for (const grp of car.groups) {
    const cloned = grp.cloneNode(true);
    for (const path of cloned.querySelectorAll('path')) {
      path.setAttribute('d', shiftPathY(path.getAttribute('d'), dy));
    }
    g.appendChild(cloned);
  }
  view.appendChild(g);

  // getBBox() はその要素のローカル座標を返す（自分の transform は未適用）。
  // 主ビュー座標に直してから寸法線と引き出しを引く。
  const toViewX = (x) => originX + x * scale;
  const toViewY = (y) => originY + y * scale;
  const local = g.getBBox();
  const L = toViewX(local.x), R = toViewX(local.x + local.width);
  const T = toViewY(local.y), B = toViewY(local.y + local.height);
  const W = R - L, H = B - T;
  // ホイール中心＝ホイールベース、パス下端＝サイドシル（地上高の基準）
  const cxs = [...g.querySelectorAll('circle')].map((c) => Number(c.getAttribute('cx'))).sort((a, b) => a - b);
  const wbL = toViewX(cxs[0]), wbR = toViewX(cxs.at(-1));
  const sillY = toViewY(Math.max(...[...g.querySelectorAll('path')].map((n) => {
    const b = n.getBBox();
    return b.y + b.height;
  })));

  // --- 寸法線のヘルパー ----------------------------------------------------
  const line = (d, extra = {}) => view.appendChild(svgEl('path', { ...DIM, ...extra, d }));
  const arrowsH = (x1, x2, y) => line(
    `M${x1} ${y} L${x1 + 4} ${y - 2.2} M${x1} ${y} L${x1 + 4} ${y + 2.2}` +
    ` M${x2} ${y} L${x2 - 4} ${y - 2.2} M${x2} ${y} L${x2 - 4} ${y + 2.2}`);
  const arrowsV = (x, y1, y2) => line(
    `M${x} ${y1} L${x - 2.2} ${y1 + 4} M${x} ${y1} L${x + 2.2} ${y1 + 4}` +
    ` M${x} ${y2} L${x - 2.2} ${y2 - 4} M${x} ${y2} L${x + 2.2} ${y2 - 4}`);
  /** 数値は線上に白抜きで乗せる（画面設計.md） */
  const dimText = (x, y, label, rotate = 0) => view.appendChild(svgEl('text', {
    x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 9.5,
    fill: 'var(--ink)', 'paint-order': 'stroke', stroke: 'var(--paper-2)', 'stroke-width': 3.5,
    ...(rotate ? { transform: `rotate(${rotate} ${x} ${y})` } : {}),
  }, label));

  // 接地線。右端は全高の寸法補助線を兼ねる
  line(`M${L - 40} ${B} L404 ${B}`, { 'stroke-dasharray': '3 3' });

  // 全長（最下段）／ホイールベース（その上）
  const yLen = 174, yWb = 156;
  line(`M${L} ${B + 3} L${L} ${yLen + 6}`);
  line(`M${R} ${B + 3} L${R} ${yLen + 6}`);
  line(`M${L} ${yLen} L${R} ${yLen}`);
  arrowsH(L, R, yLen);
  dimText((L + R) / 2, yLen, `全長 ${disp.length_mm} mm`);

  line(`M${wbL} ${B + 3} L${wbL} ${yWb + 6}`);
  line(`M${wbR} ${B + 3} L${wbR} ${yWb + 6}`);
  line(`M${wbL} ${yWb} L${wbR} ${yWb}`);
  arrowsH(wbL, wbR, yWb);
  dimText((wbL + wbR) / 2, yWb, `WB ${disp.wheelbase_mm} mm`);

  // 全高：右端の外側（バルーンより外）に置く。左の引き出し線と交差させないため。
  // 図示は誇張しているので、基準車高のときの値だけを覚えて実寸で引き算する。
  const xH = 400;
  car.overallBaseMm ??= Math.round(disp.length_mm * (H / W));
  const overall = car.overallBaseMm - rideDelta;
  line(`M${R} ${T} L404 ${T}`, { 'stroke-dasharray': '3 3' });   // 屋根からの補助線
  line(`M${xH} ${T} L${xH} ${B}`);
  arrowsV(xH, T, B);
  dimText(xH, (T + B) / 2, `全高 ${overall} mm`, -90);

  // 車高＝地上高：左下。スライダーの値がそのまま寸法値になる
  const xR = L - 18;
  line(`M${L + 10} ${sillY} L${xR - 5} ${sillY}`);
  line(`M${xR} ${sillY} L${xR} ${B}`);
  arrowsV(xR, sillY, B);
  dimText(xR, B + 13, `車高 ${settingValue('ride_height')} mm`);

  // --- 引き出し線とバルーン（寸法線より後に描いて補助線を隠す） ------------
  const order = Object.fromEntries(CATEGORIES.map((c, i) => [c.id, i + 1]));
  for (const [side, ids] of Object.entries(BALLOON_COLUMNS)) {
    const bx = side === 'left' ? 18 : 372;
    ids.forEach((id, i) => {
      const by = T + H * (side === 'left' ? 0.06 + 0.34 * i : 0.06 + 0.47 * i);
      const [fx, fy] = ANCHORS[id];
      const ax = L + W * fx, ay = T + H * fy;
      const elbowX = side === 'left' ? bx + 26 : bx - 26;
      const grp = svgEl('g', { style: 'cursor:pointer' });
      grp.appendChild(svgEl('path', {
        stroke: 'var(--ink-2)', 'stroke-width': .7, fill: 'none',
        d: `M${ax} ${ay} L${elbowX} ${by} L${bx + (side === 'left' ? 8 : -8)} ${by}`,
      }));
      grp.appendChild(svgEl('circle', { cx: ax, cy: ay, r: 1.8, fill: 'var(--ink-2)', stroke: 'none' }));
      const filled = SLOTS[id].some((s) => state.equipped[s] && isLegal(partById(state.equipped[s])));
      grp.appendChild(svgEl('circle', {
        cx: bx, cy: by, r: 8.5, fill: filled ? 'var(--ink)' : 'var(--paper-2)',
        stroke: 'var(--ink)', 'stroke-width': 1,
      }));
      grp.appendChild(svgEl('text', {
        x: bx, y: by, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 10, fill: filled ? 'var(--paper-2)' : 'var(--ink)',
      }, String(order[id])));
      grp.addEventListener('click', () => {
        el(`cat-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      view.appendChild(grp);
    });
  }

  el('scaleNote').textContent = `注記：車高の変化は図示のみ ${RIDE_EXAGGERATION} 倍に誇張。寸法値は実寸。`;
}

function drawWheelDetail() {
  const sv = el('detailWheel');
  sv.textContent = '';
  const cx = 60, cy = 52;
  const light = inSlot('wheel')?.id === 'aero_weight_light_02';
  const bigRotor = ['brake_rotor_01', 'brake_works_01'].includes(inSlot('rotor')?.id);
  const bigCaliper = ['brake_caliper_01', 'brake_works_01'].includes(inSlot('caliper')?.id);

  const g = svgEl('g', { fill: 'none', stroke: 'var(--car)', 'stroke-width': 1.1,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  g.appendChild(svgEl('circle', { cx, cy, r: 40 }));           // タイヤ外径
  g.appendChild(svgEl('circle', { cx, cy, r: 32 }));           // リム
  g.appendChild(svgEl('circle', { cx, cy, r: 7 }));            // ハブ

  // スポーク：軽量ホイールは本数が増えて細くなる
  const spokes = light ? 10 : 5;
  const sg = svgEl('g', { stroke: 'var(--car)', 'stroke-width': light ? 1.0 : 2.2, fill: 'none' });
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * Math.PI * 2 - Math.PI / 2;
    sg.appendChild(svgEl('path', {
      d: `M${cx + Math.cos(a) * 7} ${cy + Math.sin(a) * 7} L${cx + Math.cos(a) * 31} ${cy + Math.sin(a) * 31}`,
    }));
  }
  g.appendChild(sg);

  // ローター（径が変わる）とキャリパー
  const rr = bigRotor ? 26 : 20;
  g.appendChild(svgEl('circle', { cx, cy, r: rr, stroke: 'var(--ink-2)', 'stroke-width': .8 }));
  g.appendChild(svgEl('circle', { cx, cy, r: rr - 3, stroke: 'var(--ink-2)', 'stroke-width': .5,
    'stroke-dasharray': '2 3' }));
  const cw = bigCaliper ? 18 : 12, ch = bigCaliper ? 13 : 9;
  g.appendChild(svgEl('rect', { x: cx - cw / 2, y: cy - rr - ch + 3, width: cw, height: ch,
    rx: 2, stroke: 'var(--ink)', 'stroke-width': 1 }));
  if (bigCaliper) {
    for (const dx of [-5, 0, 5]) {
      g.appendChild(svgEl('circle', { cx: cx + dx, cy: cy - rr - ch / 2 + 3, r: 1.6,
        stroke: 'var(--ink-2)', 'stroke-width': .6 }));
    }
  }
  sv.appendChild(g);
  el('wheelSub').innerHTML =
    `${light ? '軽量ホイール' : '純正ホイール'} / ${bigCaliper ? '対向キャリパー' : '標準キャリパー'}<br>
     スポーク ${spokes}本・ローター ${bigRotor ? '大径' : '標準'}`;
}

function drawSuspDetail() {
  const sv = el('detailSusp');
  sv.textContent = '';
  const damper = inSlot('damper');
  const kind = !damper ? 'stock'
    : damper.id === 'suspension_damper_01' ? 'damper'
    : damper.id === 'suspension_coilover_01' ? 'coilover'
    : ['suspension_coilover_02', 'suspension_works_01'].includes(damper.id) ? 'race' : 'other';
  const spec = {
    stock:    { coils: 5,  knobs: 0, thread: false, label: '純正（調整不可）' },
    other:    { coils: 6,  knobs: 0, thread: false, label: '社外ダンパー' },
    damper:   { coils: 7,  knobs: 1, thread: false, label: '純正形状・減衰調整式' },
    coilover: { coils: 9,  knobs: 1, thread: true,  label: '車高調（全長調整）' },
    race:     { coils: 12, knobs: 3, thread: true,  label: 'レース用・3way 減衰' },
  }[kind];

  const g = svgEl('g', { fill: 'none', stroke: 'var(--car)', 'stroke-width': 1.1,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  const topY = 12, botY = 78, cx = 52;
  g.appendChild(svgEl('path', { d: `M${cx - 14} ${topY} L${cx + 14} ${topY}` }));   // アッパーマウント
  g.appendChild(svgEl('path', { d: `M${cx} ${topY} L${cx} ${topY + 8}` }));

  // 車高を下げるほどバネが縮む（巻きの間隔が詰まる）
  const disp = chassis().display;
  const ratio = spec.thread
    ? 1 - (disp.ride_height_mm - settingValue('ride_height')) / 120
    : 1;
  const springTop = topY + 10, springBot = botY - 14;
  const pitch = ((springBot - springTop) / spec.coils) * ratio;
  const w = 13;
  let d = `M${cx - w} ${springTop}`;
  for (let i = 0; i < spec.coils; i++) {
    d += ` L${cx + w} ${springTop + pitch * (i + .5)} L${cx - w} ${springTop + pitch * (i + 1)}`;
  }
  g.appendChild(svgEl('path', { d }));
  const shaftBot = springTop + pitch * spec.coils;
  g.appendChild(svgEl('path', { d: `M${cx} ${springTop} L${cx} ${shaftBot + 9}` }));  // シャフト
  g.appendChild(svgEl('path', { d: `M${cx - 10} ${shaftBot + 9} L${cx + 10} ${shaftBot + 9}` }));

  if (spec.thread) {   // 車高調整のネジ山
    const tg = svgEl('g', { stroke: 'var(--ink-2)', 'stroke-width': .6, fill: 'none' });
    for (let y = shaftBot + 1; y < shaftBot + 9; y += 2) {
      tg.appendChild(svgEl('path', { d: `M${cx - 9} ${y} L${cx + 9} ${y}` }));
    }
    g.appendChild(tg);
  }
  for (let i = 0; i < spec.knobs; i++) {   // 減衰調整ノブ
    g.appendChild(svgEl('circle', { cx: cx + 22, cy: topY + 14 + i * 11, r: 4,
      stroke: 'var(--ink)', 'stroke-width': .9 }));
  }

  // スタビ：前後が揃っているかを記号で示す（単体だと balance が偏る）
  const sf = inSlot('stabi_front'), sr = inSlot('stabi_rear');
  const mark = (x, label, on) => {
    g.appendChild(svgEl('rect', { x, y: 88, width: 20, height: 10, rx: 1,
      stroke: on ? 'var(--car)' : 'var(--ink-3)', 'stroke-width': .8,
      'stroke-dasharray': on ? 'none' : '2 2' }));
    g.appendChild(svgEl('text', { x: x + 10, y: 93.5, 'text-anchor': 'middle',
      'dominant-baseline': 'central', 'font-size': 6.5, stroke: 'none',
      fill: on ? 'var(--car)' : 'var(--ink-3)' }, label));
  };
  mark(24, '前', !!sf);
  mark(56, '後', !!sr);
  sv.appendChild(g);

  const stabi = sf && sr ? '前後セット（balance 相殺）' : sf ? '前のみ' : sr ? '後のみ' : 'なし';
  el('suspSub').innerHTML =
    `${spec.label}<br>巻き数 ${spec.coils}・減衰 ${spec.knobs}way / スタビ ${stabi}`;
}

function drawSliders() {
  const wrap = el('sliders');
  wrap.textContent = '';
  const parts = activeParts();
  const ch = chassis();

  for (const def of Object.values(SETTINGS)) {
    const unlocked = isSettingUnlocked(def, parts);
    const box = document.createElement('div');
    box.className = 'slider';
    if (!unlocked) {
      // 未解禁のものは存在だけ見せる（「まだここに何か付く」の予告）
      const need = def.unlockedBy.map((id) => partById(id)?.name).filter(Boolean);
      box.innerHTML = `<div class="row"><span style="color:var(--ink-3)">${def.label}</span>
        <span class="locked">未解禁</span></div>
        <div class="locked">${need.join(' / ')} を装着すると調整できる</div>`;
      wrap.appendChild(box);
      continue;
    }
    const { min, max } = def.rangeFor(ch);
    const value = settingValue(def.key);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${def.label}</span>
      <span class="val">${value}<span class="u"> ${def.unit}</span></span>`;
    const input = document.createElement('input');
    Object.assign(input, { type: 'range', min, max, step: def.step, value });
    input.addEventListener('input', () => {
      state.settings[def.key] = Number(input.value);
      row.querySelector('.val').innerHTML = `${input.value}<span class="u"> ${def.unit}</span>`;
      // 車高はシルエットと寸法に直結するので即再描画
      if (def.key === 'ride_height') { drawMainView(); drawSuspDetail(); }
      drawStatus();
      clearLaps();
    });
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = {
      tire_pressure: '高いほど温まりが早く、早くタレる。基準から離すと接地が崩れる',
      ride_height: '下げると重心と空力で得るが、ストロークを失う',
      brake_bias: '後ろへ寄せると頭が入り、安定を失う。振るほど制動距離は伸びる',
    }[def.key] ?? '';
    box.append(row, input, hint);
    wrap.appendChild(box);
  }
}

function drawBom() {
  const bom = el('bom');
  bom.textContent = '';

  CATEGORIES.forEach((cat, i) => {
    const slots = SLOTS[cat.id];
    const filled = slots.filter((s) => state.equipped[s]).length;
    const head = document.createElement('div');
    head.className = 'bom-cat';
    head.id = `cat-${cat.id}`;
    head.innerHTML = `<span class="no">${i + 1}</span><span>${cat.label}</span>
      <span class="fill">${filled} / ${slots.length} スロット</span>`;
    bom.appendChild(head);

    for (const slot of slots) {
      const p = partById(state.equipped[slot]);
      const unit = coveredBy(slot);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bom-row';
      let name;
      if (unit) {
        name = `<span class="name included">（${unit.name}に含む）</span>`;
      } else if (p) {
        name = `<span class="name">${p.name}</span>`
          + (isLegal(p) ? '' : '<span class="badge">規定外</span>')
          + (p.replaces?.length ? '<span class="badge unit">ユニット</span>' : '');
      } else {
        name = '<span class="name empty">未装着</span>';
      }
      btn.innerHTML = `<span class="slot">${SLOT_LABEL[slot]}</span><span>${name}</span>
        <span class="chev">選択 ▸</span>`;
      btn.addEventListener('click', () => openPicker(slot));
      bom.appendChild(btn);

  const bad = illegalParts();
  warn.innerHTML = bad.length
    ? `<div class="warn">規定外のパーツが ${bad.length} 点あります（${bad.map((p) => p.name).join('、')}）。
       クラス${Math.max(...bad.map((p) => p.class_required))}以上でないと装着できないため、性能計算から除外しています。</div>`
    : '';
}

// ---------------------------------------------------------------------------
// パーツ選択モニター（画面の層）。docs/設計/画面設計.md
//   左：候補、右：現在 → 装着後（レーダー6軸）、下：大河の note（紙）、フッター：装着。
//   装着してもモニターは閉じない。数字が回って新しい値になり、続けて別の候補を試せる。
// ---------------------------------------------------------------------------
/** そのスロットを占有しうるパーツ（ユニット部品は占有する全スロットに出る）。クラス順 → 価格順。 */
const candidatesFor = (slot) => DATA.parts
  .filter((p) => occupiedSlots(p).includes(slot))
  .sort((a, b) => a.class_required - b.class_required || a.price - b.price);

/** 装着・取り外しの直前の値。描画時にここから新しい値へ数字を回す。描き終えたら捨てる。 */
let pendingRoll = null;

function openPicker(slot) {
  const list = candidatesFor(slot);
  state.openSlot = slot;
  state.candidate = state.equipped[slot] ?? (list.find(isLegal) ?? list[0])?.id ?? null;
  drawModal();
  el('modalBack').hidden = false;
  el('modClose').focus();
  cue('modal.open', { slot });
}

function closePicker() {
  if (!state.openSlot) return;
  state.openSlot = null;
  state.candidate = null;
  el('modalBack').hidden = true;
  cue('modal.close');
}

/** 装着・取り外し。直前の値を控えてから描き直し、数字を回す。 */
function equipFromModal(part) {
  pendingRoll = { axes: radarValues(perf()), status: statusValues() };
  equipPart(part);
  cue('part.equip', { id: part.id, slot: state.openSlot });
  renderAll();
  pendingRoll = null;
}
function removeFromModal() {
  const id = state.equipped[state.openSlot];
  if (!id) return;
  pendingRoll = { axes: radarValues(perf()), status: statusValues() };
  unequipSlot(state.openSlot);
  cue('part.remove', { id, slot: state.openSlot });
  renderAll();
  pendingRoll = null;
}

/** 規定・スポンサー段階で装着できない理由。空なら装着できる。 */
function lockReasons(p) {
  const r = [];
  if (p.class_required > state.cls) r.push(`クラス${p.class_required}から`);
  if (p.sponsor_tier > state.tier) r.push(`スポンサー段階${p.sponsor_tier}から`);
  return r;
}

function drawModal() {
  const slot = state.openSlot;
  if (!slot) return;
  const cat = CATEGORIES.find((c) => c.id === slotCategory(slot));
  el('modTitle').textContent = `${cat.label} / ${SLOT_LABEL[slot]}`;

  // --- 左：候補リスト ----------------------------------------------------
  const list = candidatesFor(slot);
  if (!list.some((p) => p.id === state.candidate)) state.candidate = list[0]?.id ?? null;
  const box = el('modList');
  box.textContent = '';
  for (const p of list) {
    const legal = isLegal(p);
    const on = state.equipped[slot] === p.id;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `cand${legal ? '' : ' locked'}${p.id === state.candidate ? ' sel' : ''}`;
    const why = lockReasons(p);
    btn.innerHTML = `<span class="mk">${on ? '●' : legal ? '' : '🔒'}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="pr">¥${p.price.toLocaleString('ja-JP')}</span>
      ${why.length ? `<span class="why">${esc(why.join(' / '))}</span>`
        : on ? '<span class="why" style="color:var(--mon-green)">装着中</span>' : ''}`;
    btn.addEventListener('click', () => {
      if (state.candidate === p.id) return;
      state.candidate = p.id;
      cue('part.select', { id: p.id });
      drawModal();
    });
    box.appendChild(btn);
  }

  // --- 右：比較 ----------------------------------------------------------
  drawCompare();

  // --- 下：大河の note（ここだけ紙） --------------------------------------
  const cand = partById(state.candidate);
  el('modNote').innerHTML = `<span class="k">親父のノート</span>${cand ? esc(cand.note) : '—'}`;

  // --- フッター ----------------------------------------------------------
  const foot = el('modFoot');
  foot.textContent = '';
  const on = !!cand && state.equipped[slot] === cand.id;
  const legal = !!cand && isLegal(cand);
  // 付け替えで外れるパーツを先に知らせる
  const evicts = cand && !on
    ? equippedParts()
      .filter((c) => c.id !== cand.id && occupiedSlots(c).some((s) => occupiedSlots(cand).includes(s)))
      .map((c) => c.name)
    : [];
  const msg = document.createElement('span');
  msg.className = 'msg';   // 紙の .warn（規定外の警告）と名前を分ける
  if (cand && !legal) msg.textContent = `${lockReasons(cand).join(' / ')}。手に入れても規定で付かない`;
  else if (evicts.length) msg.textContent = `装着すると ${evicts.join('、')} が外れる`;
  else { msg.classList.add('ok'); msg.textContent = on ? 'このスロットに装着中' : ''; }
  foot.appendChild(msg);

  if (state.equipped[slot]) {
    const off = document.createElement('button');
    off.type = 'button';
    off.textContent = '外す';
    off.addEventListener('click', removeFromModal);
    foot.appendChild(off);
  }
  const pick = document.createElement('button');
  pick.type = 'button';
  pick.className = 'primary';
  pick.textContent = on ? '装着中' : legal ? '装着する' : '装着できない';
  pick.disabled = !cand || !legal || on;
  pick.addEventListener('click', () => equipFromModal(cand));
  foot.appendChild(pick);
}

/** 右側：いまの車と、候補を装着した車を並べる。レーダー6軸 ＋ 数値 ＋ 効果／副作用の生の値。 */
function drawCompare() {
  const box = el('modCmp');
  const cand = partById(state.candidate);
  if (!cand) { box.innerHTML = '<div class="cmp-cap">候補が無い</div>'; return; }
  const on = state.equipped[state.openSlot] === cand.id;
  const now = perf();
  const after = on ? now : perfOf(equippedWith(cand));
  const a0 = radarValues(now), a1 = radarValues(after);
  const from = pendingRoll?.axes ?? [];
  // 目盛：クラスごとの下限を持ちつつ、現在・装着後・回転の起点がすべて収まる幅
  const span = Math.max(...[...a0, ...a1, ...from].map(Math.abs));
  const scale = Math.max(RADAR_FLOOR[state.cls] ?? 12, Math.ceil(span * 1.2));
  const fmt1 = (v) => (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + Math.abs(v).toFixed(1);

  const rows = RADAR_AXES.map((ax, i) => {
    const d = a1[i] - a0[i];
    const cls = Math.abs(d) < 0.05 ? 'eq' : d > 0 ? 'up' : 'dn';
    return `<tr><td class="lb">${ax.label}</td>
      <td class="now" data-axis="${i}">${fmt1(a0[i])}</td><td class="arrow">→</td>
      <td class="after">${fmt1(a1[i])}</td><td class="d ${cls}">${cls === 'eq' ? '±0' : fmt1(d)}</td></tr>`;
  }).join('');
  const chips = (obj, cls) => Object.entries(obj ?? {})
    .map(([k, v]) => `<span class="${cls}">${STAT_LABEL[k] ?? k} ${v > 0 ? '+' : ''}${v}</span>`).join('')
    || '<span class="none">—</span>';
  const unit = cand.replaces?.length
    ? `<span class="unit">ユニット：${occupiedSlots(cand).map((s) => SLOT_LABEL[s]).join('・')} を占有</span>` : '';

  box.innerHTML = `
    <div class="cmp-head">
      <span class="nm">${esc(cand.name)}</span>
      <span class="meta">¥${cand.price.toLocaleString('ja-JP')} · CLASS ${cand.class_required} · TIER ${cand.sponsor_tier}</span>
      ${unit}
    </div>
    ${radarSvg(a0, a1, scale, on)}
    <table class="axes">
      <tr><th>AXIS</th><th>NOW</th><th></th><th>AFTER</th><th>Δ</th></tr>
      ${rows}
    </table>
    <div class="cmp-cap">EFFECT</div>
    <div class="chips">${chips(cand.effects, 'e')}</div>
    <div class="cmp-cap">SIDE EFFECT</div>
    <div class="chips">${chips(cand.side_effects, 's')}</div>`;

  // 装着・取り外しの直後は「現在」の数字を旧値から回す
  if (pendingRoll?.axes) {
    for (const td of box.querySelectorAll('td.now')) {
      const i = Number(td.dataset.axis);
      rollNumber(td, pendingRoll.axes[i], a0[i], fmt1);
    }
  }
}

/** レーダーチャート。現在＝白の細線、装着後＝緑の面。0 が中心と外周の中間。 */
function radarSvg(cur, after, scale, same) {
  const C = 100, R = 72;
  const n = RADAR_AXES.length;
  const ang = (i) => -Math.PI / 2 + (i * Math.PI * 2) / n;
  const xy = (i, f) => [C + Math.cos(ang(i)) * R * f, C + Math.sin(ang(i)) * R * f];
  const pt = (i, f) => xy(i, f).map((v) => v.toFixed(1)).join(',');
  const radius = (v) => Math.min(1, Math.max(0.04, 0.5 + v / (2 * scale)));
  const poly = (vals) => vals.map((v, i) => pt(i, radius(v))).join(' ');
  const ring = (f) => RADAR_AXES.map((_, i) => pt(i, f)).join(' ');
  const labels = RADAR_AXES.map((ax, i) => {
    const [x, y] = xy(i, 1 + 15 / R);
    return `<text class="axis-label" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${ax.label}</text>`;
  }).join('');
  const spokes = RADAR_AXES.map((_, i) => {
    const [x, y] = xy(i, 1);
    return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--mon-line)" stroke-width=".6"/>`;
  }).join('');
  const [zx, zy] = xy(0, 0.5);
  return `<svg class="radar" viewBox="0 0 200 200" aria-label="現在と装着後の6軸比較">
    ${[0.25, 0.75, 1].map((f) => `<polygon points="${ring(f)}" fill="none" stroke="var(--mon-line)" stroke-width=".7"${f < 1 ? ' stroke-dasharray="2 3"' : ''}/>`).join('')}
    <polygon points="${ring(0.5)}" fill="none" stroke="var(--mon-dim)" stroke-width=".8"/>
    ${spokes}
    ${labels}
    <text x="${(zx + 3).toFixed(1)}" y="${(zy - 3).toFixed(1)}" font-size="7" fill="var(--mon-dim)">0</text>
    ${same ? '' : `<polygon points="${poly(cur)}" fill="none" stroke="var(--mon-text)" stroke-width="1.1" stroke-dasharray="3 2"/>`}
    <polygon points="${poly(after)}" fill="var(--mon-green)" fill-opacity=".16" stroke="var(--mon-green)" stroke-width="1.4"/>
  </svg>`;
}

// ---------------------------------------------------------------------------
// 下段ステータス
// ---------------------------------------------------------------------------
/** 下段ステータスの数値（換算済み）。装着前の値を控えて数字を回すのにも使う。 */
function statusValues() {
  const p = perf();
  const disp = chassis().display;
  return {
    kg: Math.round(disp.weight_kg + (p.stats.weight + p.stats.unsprung_weight) * KG_PER_POINT),
    ps: Math.round(disp.power_ps + p.stats.power * PS_PER_POINT),
    bal: p.stats.balance,
    unsprung: p.stats.unsprung_weight, heat: p.stats.heat, reliability: p.stats.reliability,
  };
}

function drawStatus() {
  const v = statusValues();
  const pref = DATA.driver.preferred_balance;
  const dev = v.bal - pref;
  const tend = Math.abs(dev) < 0.5 ? '好みどおり' : dev > 0 ? 'オーバー寄り' : 'アンダー寄り';
  const fmt = (x) => (x > 0 ? '+' : '') + x.toFixed(1);

  el('status').innerHTML = `
    <div><div class="k">WEIGHT</div><div class="v"><span id="stKg"></span><span class="u"> kg</span></div>
      <div class="sub">ばね下 ${fmt(v.unsprung)} pt</div></div>
    <div><div class="k">POWER</div><div class="v"><span id="stPs"></span><span class="u"> ps</span></div>
      <div class="sub">発熱 ${fmt(v.heat)} / 信頼性 ${fmt(v.reliability)}</div></div>
    <div><div class="k">BALANCE</div><div class="v" id="stBal"></div>
      <div class="sub">好み ${fmt(pref)} に対し ${tend}（ズレ ${Math.abs(dev).toFixed(1)}）</div></div>`;
  // 装着・取り外しの直後だけ旧値から回す。スライダー操作では置くだけ
  const from = pendingRoll?.status;
  rollNumber(el('stKg'), from?.kg, v.kg, (x) => String(Math.round(x)));
  rollNumber(el('stPs'), from?.ps, v.ps, (x) => String(Math.round(x)));
  rollNumber(el('stBal'), from?.bal, v.bal, fmt);
}

// ---------------------------------------------------------------------------
// ピットでの一言（docs/設計/無線.md）
//
// 無線ではなく、ピットでの会話。判定は race.js の pitComment、台詞は data/radio.json。
// 答えは言わない。無視してもいい（無視するとタイムが落ちるのは計算式が証明している）。
// ---------------------------------------------------------------------------
/** いま出している一言の ID。変わったときだけ台詞を引き直す（触るたびに喋り直さない）。 */
let pitShown = null;
/** 判定より優先して1回だけ出す一言（ノートを写した直後の「親父ならこうしてた」など）。 */
let pitOverride = null;

function drawPitLine() {
  let id = pitComment(perf(), DATA.driver, { parts: activeParts(), settings: activeSettings(), session: state.session });
  if (pitOverride) { id = pitOverride; pitOverride = null; pitShown = null; }
  const box = el('pitline');
  const def = id ? DATA.radio.pit[id] : null;
  if (!def) { box.hidden = true; pitShown = null; return; }
  if (id !== pitShown) {
    pitShown = id;
    const line = def.lines[Math.floor(Math.random() * def.lines.length)];
    el('pitlineText').textContent = typeof line === 'string' ? line : line.text;
  }
  box.hidden = false;
}

// ---------------------------------------------------------------------------
// 父のノートの基準セッティング（data/notes.json）
//
// コース × クラスごとの、大河が書き残した基準。ボタンで丸ごと写す。
// クラス5にはページが無い（父の記述が尽きる——題名の回収はそこから始まる）。
// ---------------------------------------------------------------------------
const noteFor = () => DATA.notes.find((n) => n.course === el('selCourse').value && n.class === state.cls) ?? null;

function drawNotes() {
  const n = noteFor();
  const cur = DATA.courses.find((c) => c.id === el('selCourse').value);
  el('notesWhere').textContent = `${cur?.name ?? '—'} / クラス${state.cls}`;
  const text = el('notesText');
  if (n) {
    text.textContent = state.session === 'quali' && n.quali ? n.quali.note : n.note;
    text.classList.remove('blank');
    el('notesBtn').disabled = false;
  } else {
    text.textContent = state.cls >= 5 ? 'この先のページは白紙。' : 'このコース・このクラスのページは無い。';
    text.classList.add('blank');
    el('notesBtn').disabled = true;
  }
}

/** ノートの基準を丸ごと写す。装着はスロット単位で置き換え、連続値も入れる。 */
function applyNote() {
  const n = noteFor();
  if (!n) return;
  for (const slot of Object.keys(state.equipped)) state.equipped[slot] = null;
  for (const id of n.parts) {
    const p = partById(id);
    if (p) equipPart(p);
  }
  state.settings = state.session === 'quali' ? { ...n.settings, ...(n.quali?.settings ?? {}) } : { ...n.settings };
  pitOverride = 'from_notes';
  renderAll();
  clearLaps(true);
}

// ---------------------------------------------------------------------------
// ラップ計算
// ---------------------------------------------------------------------------
/** 直前の計算結果。次の計算で「何秒変わったか」を出すための基準。 */
let lapBaseline = null;

/** セッティングが変わったことを示す。基準は残すので、次の計算で差が出る。 */
function clearLaps(resetBaseline = false) {
  if (resetBaseline) lapBaseline = null;
  if (!el('lapsWrap').innerHTML) return;
  el('lapsWrap').innerHTML = `<h2>ラップ計算 / 10周平均</h2><div class="laps"><div class="lap">
    <span class="cprof">セッティングを変更しました。${lapBaseline ? '前回との差を見るには' : ''}もう一度ラップ計算してください</span></div></div>`;
}

/** 選びたいコース。クラスを変えて走れなくなったら、走れるものへ寄せる。 */
const wanted = { course: null };

function drawCourses() {
  const list = usableCourses();
  const sel = el('selCourse');
  sel.innerHTML = list
    .map((c) => `<option value="${c.id}">${c.name}（${PROFILE_LABEL[c.profile] ?? ''}・${c.length.toLocaleString('ja-JP')}m）</option>`)
    .join('');
  if (wanted.course && list.some((c) => c.id === wanted.course)) sel.value = wanted.course;
  else wanted.course = sel.value;
  const cur = list.find((c) => c.id === sel.value);
  el('courseNote').textContent = cur ? cur.description : '';
  const hidden = DATA.courses.length - list.length;
  el('courseHidden').textContent = hidden
    ? `クラス${state.cls}では走れないコースが ${hidden} 本あります（規定でクラスが決まっています）。` : '';
  drawNotes();
}

/** そのクラスで走れるコースだけ。classes が無いデータは全クラス可とみなす。 */
const usableCourses = () => DATA.courses.filter((c) => !c.classes || c.classes.includes(state.cls));

function calcLaps() {
  const p = perf();
  if (state.session === 'quali') return calcQuali(p);
  const rows = usableCourses().map((c) => {
    const r = simulateRace(p, c, 10, DATA.driver, { noise: false, retire: false });
    return { course: c, avg: r.average, best: r.best, last: r.laps.at(-1) };
  });
  const prev = lapBaseline;
  lapBaseline = Object.fromEntries(rows.map((r) => [r.course.id, r.avg]));

  el('lapsWrap').innerHTML = `<h2>ラップ計算 / 10周平均</h2><div class="laps">${rows.map((r) => {
    const d = prev?.[r.course.id] != null ? r.avg - prev[r.course.id] : null;
    const dTxt = d == null ? ''
      : `<div class="d">${d > 0 ? '+' : ''}${d.toFixed(3)} 秒/周</div>`;
    return `<div class="lap">
      <div class="cname">${r.course.name}<div class="cprof">${PROFILE_LABEL[r.course.profile] ?? ''}
        ・最終周 ブレーキ温度 ${Math.round(r.last.brakeTemp)}${r.last.brakeFade > 0 ? `（フェード −${r.last.brakeFade.toFixed(1)}）` : ''}</div></div>
      <div><div class="t">${formatTime(r.avg)}</div>${dTxt}</div>
    </div>`;
  }).join('')}</div>`;
}

/** 予選タブのラップ計算：計測3周のベスト（アタックラップ）。 */
function calcQuali(p) {
  const rows = usableCourses().map((c) => {
    const r = simulateQualifying(p, c, DATA.driver, { noise: false });
    return { course: c, best: r.best, attack: r.attack };
  });
  const prev = lapBaseline;
  lapBaseline = Object.fromEntries(rows.map((r) => [r.course.id, r.best]));
  el('lapsWrap').innerHTML = `<h2>予選計算 / アタック1周</h2><div class="laps">${rows.map((r) => {
    const d = prev?.[r.course.id] != null ? r.best - prev[r.course.id] : null;
    const dTxt = d == null ? '' : `<div class="d">${d > 0 ? '+' : ''}${d.toFixed(3)} 秒</div>`;
    return `<div class="lap">
      <div class="cname">${r.course.name}<div class="cprof">${PROFILE_LABEL[r.course.profile] ?? ''}
        ・アタック時の冷間ロス −${r.attack.gripLoss.toFixed(1)} pt</div></div>
      <div><div class="t">${formatTime(r.best)}</div>${dTxt}</div>
    </div>`;
  }).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// レースへ渡す（URL パラメータ。ブラウザストレージは使わない＝PLiCy の制約）
//   決勝用：parts / tp / rh / bb、予選用：qparts / qtp / qrh / qbb。
//   grid は予選結果（車 id の並び）か 'last'（予選をスキップして最後尾）。
// ---------------------------------------------------------------------------
const SHORT = { tire_pressure: 'tp', ride_height: 'rh', brake_bias: 'bb' };

/** そのセッションの装着と連続値をパラメータに載せる。 */
function putSetup(q, session) {
  const setup = session === state.session ? snapshotSetup() : state.stash[session];
  if (!setup) return;
  const prefix = session === 'quali' ? 'q' : '';
  const ids = [...new Set(Object.values(setup.equipped).filter(Boolean))]
    .map(partById).filter((p) => p && isLegal(p)).map((p) => p.id);
  if (ids.length) q.set(`${prefix}parts`, ids.join(','));
  const parts = ids.map(partById);
  for (const [key, def] of Object.entries(SETTINGS)) {
    if (!isSettingUnlocked(def, parts)) continue;
    q.set(`${prefix}${SHORT[key]}`, setup.settings[key] ?? def.defaultValue(chassis()));
  }
}

function raceUrl(session) {
  const q = new URLSearchParams();
  q.set('session', session);
  q.set('course', el('selCourse').value);
  q.set('laps', el('selLaps').value);
  q.set('cls', state.cls);
  q.set('tier', state.tier);
  putSetup(q, 'race');
  putSetup(q, 'quali');
  if (session === 'race') q.set('grid', gridParam ?? 'last');
  return `race.html?${q}`;
}

/** 予選結果として受け取ったグリッド。無ければ最後尾スタート。 */
let gridParam = null;

function drawRaceButton() {
  const btn = el('raceBtn');
  if (gridParam && gridParam !== 'last') {
    const pos = gridParam.split(',').indexOf('me') + 1;
    btn.textContent = pos ? `決勝開始（${pos}番グリッド）` : '決勝開始';
  } else {
    btn.textContent = '決勝開始（予選なし＝最後尾）';
  }
}

// ---------------------------------------------------------------------------
// 再描画
// ---------------------------------------------------------------------------
function renderAll() {
  const ch = chassis();
  el('driverName').textContent = DATA.driver.name;
  el('classLine').textContent = `クラス${state.cls} ${CLASS_LABEL[state.cls]} / スポンサー段階${state.tier} ${TIER_LABEL[state.tier]}`;
  el('sheetNo').textContent = `ST-${String(state.cls).padStart(2, '0')}-${ch.id.slice(0, 3).toUpperCase()}`;
  el('chassisName').textContent = ch.name;
  drawMainView();
  drawWheelDetail();
  drawSuspDetail();
  drawSliders();
  drawBom();
  drawModal();
  drawStatus();
  drawPitLine();
  if (el('selCourse').dataset.ready) drawCourses();
  clearLaps();
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
try {
  DATA = await loadAll();
  el('selClass').addEventListener('change', (e) => {
    state.cls = Number(e.target.value);
    state.settings = {};        // 車体が変わると車高の基準も変わるので既定に戻す
    state.stash = { quali: null, race: null };   // 予選用も作り直し
    gridParam = null;           // 別クラスの予選結果は使えない
    drawRaceButton();
    renderAll();
    clearLaps(true);            // 別の車になるので前回ラップとは比べない
  });
  el('selTier').addEventListener('change', (e) => { state.tier = Number(e.target.value); renderAll(); });
  el('calcBtn').addEventListener('click', calcLaps);
  // パーツ選択モニターを閉じる：✕、背景タップ、Esc
  el('modClose').addEventListener('click', closePicker);
  el('modalBack').addEventListener('click', (e) => { if (e.target === el('modalBack')) closePicker(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });

  // コース選択肢。URL に course があればそれを初期値にする（レースから戻ったとき用）
  const back = new URLSearchParams(location.search);
  if (back.get('course')) wanted.course = back.get('course');
  if (back.get('laps')) el('selLaps').value = back.get('laps');
  el('selCourse').addEventListener('change', () => { wanted.course = el('selCourse').value; drawCourses(); });
  el('raceBtn').addEventListener('click', () => { location.href = raceUrl('race'); });
  el('qualiBtn').addEventListener('click', () => { location.href = raceUrl('quali'); });
  el('notesBtn').addEventListener('click', applyNote);
  el('tabQuali').addEventListener('click', () => switchSession('quali'));
  el('tabRace').addEventListener('click', () => switchSession('race'));
  if (back.get('grid')) gridParam = back.get('grid');
  drawRaceButton();

  // レース画面から戻ってきたときは、そのときのクラス・スポンサー・装着を復元する
  if (back.get('cls')) {
    state.cls = Math.min(5, Math.max(1, Number(back.get('cls'))));
    el('selClass').value = String(state.cls);
  }
  if (back.get('tier')) {
    state.tier = Math.min(4, Math.max(0, Number(back.get('tier'))));
    el('selTier').value = String(state.tier);
  }
  for (const id of (back.get('parts') ?? '').split(',').filter(Boolean)) {
    const p = partById(id);
    if (p && isLegal(p)) equipPart(p);
  }
  for (const [key, short] of Object.entries(SHORT)) {
    if (back.get(short) !== null) state.settings[key] = Number(back.get(short));
  }
  // 予選用セッティングが URL にあれば、決勝用とは別に控えておく
  if (back.get('qparts') !== null || back.get('qtp') !== null) {
    const quali = { equipped: Object.fromEntries(ALL_SLOTS.map((s) => [s, null])), settings: {} };
    const raceNow = snapshotSetup();
    for (const id of (back.get('qparts') ?? '').split(',').filter(Boolean)) {
      const p = partById(id);
      if (p && isLegal(p)) for (const slot of occupiedSlots(p)) quali.equipped[slot] = p.id;
    }
    for (const [key, short] of Object.entries(SHORT)) {
      if (back.get(`q${short}`) !== null) quali.settings[key] = Number(back.get(`q${short}`));
    }
    state.stash.quali = quali;
    loadSetup(raceNow);
  }

  el('selCourse').dataset.ready = '1';
  drawCourses();
  renderAll();
  if (back.get('session') === 'quali') switchSession('quali');   // 予選から戻ったら予選タブ
} catch (err) {
  document.body.insertAdjacentHTML('afterbegin',
    `<div class="err">読み込みに失敗しました：${err.message}<br>
     このページは JSON と SVG を読み込むため、<b>HTTP 経由で開く必要があります</b>
     （file:// では動きません）。</div>`);
  console.error(err);
}
</script>
</body>
</html>
